// Restaurar backup: junta com o que já existe (nunca apaga nem altera fechamentos)
function restaurarBackup(files){
  var f=files&&files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    var d; try{ d=JSON.parse(rd.result); }catch(e){ alert('Esse arquivo não é um backup válido.'); return; }
    if(!d || !d.eventos){ alert('Esse arquivo não parece um backup do WhatsApp Eventos.'); return; }
    function juntar(lista, novos){ (novos||[]).forEach(function(x){ if(!lista.some(function(y){return y.id===x.id;})) lista.push(x); }); }
    var antes={ev:STORE.eventos.length, mk:STORE.marcas.length, c:STORE.colaboradores.length, f:(STORE.fechamentos||[]).length};
    juntar(STORE.eventos, d.eventos); juntar(STORE.marcas, d.marcas); juntar(STORE.financeiro, d.financeiro); juntar(STORE.colaboradores, d.colaboradores);
    STORE.fechamentos=STORE.fechamentos||[]; juntar(STORE.fechamentos, (d.fechamentos||[]).map(function(x){ x.sync=x.sync||'pendente'; return x; }));
    STORE.agendas=STORE.agendas||{}; Object.keys(d.agendas||{}).forEach(function(m){ if(!STORE.agendas[m]) STORE.agendas[m]=d.agendas[m]; });
    if(d.apelidos && (!STORE.apelidos || STORE.apelidos===APELIDOS_PADRAO)) STORE.apelidos=d.apelidos;
    salvar(); render();
    alert('Backup restaurado!\n\n+'+(STORE.eventos.length-antes.ev)+' evento(s)\n+'+(STORE.marcas.length-antes.mk)+' marcação(ões) de horário\n+'+(STORE.colaboradores.length-antes.c)+' colaborador(es)\n+'+(STORE.fechamentos.length-antes.f)+' fechamento(s)\n\nNada que já existia foi apagado ou alterado.');
    sincronizarBanco(true);
  };
  rd.readAsText(f,'utf-8');
}

function fmtDuracao(ms, sep){
  var totalMin = Math.round(ms/60000);
  var neg = totalMin<0; totalMin=Math.abs(totalMin);
  var h = Math.floor(totalMin/60), m = totalMin%60;
  return (neg?'-':'')+(h<10?'0':'')+h+(sep||'h')+(m<10?'0':'')+m;
}

function celulaMarca(mk){
  var ts=tsDe(mk), nota='';
  if(mk.validadoHora) nota='<div class="tag-dig" style="color:#7aa8ff">✓ validada por você</div>';
  else if(mk.tsManual) nota='<div class="tag-dig man">✎ ajustado à mão</div>';
  else if(mk.tsDigitada && digitadaValida(mk) && Math.abs(new Date(mk.tsDigitada)-new Date(mk.tsEnvio))>=10*60000){
    nota = STORE.horaBase==='digitada'
      ? '<div class="tag-dig" title="Hora escrita na mensagem. A mensagem foi enviada em '+fmtDT(mk.tsEnvio)+'">✍ escrita · enviada '+fmtHora(mk.tsEnvio)+'</div>'
      : '<div class="tag-dig" title="Na mensagem estava escrito '+fmtHora(mk.tsDigitada)+'">✉ envio · escrita '+fmtHora(mk.tsDigitada)+'</div>';
  }
  if(mk.txt||mk.remetente) nota+='<div class="tag-dig" style="cursor:help" title="'+esc((mk.remetente?mk.remetente+' — '+fmtDT(mk.tsEnvio)+':\n':'')+(mk.txt||''))+'">💬 ver mensagem</div>';
  return '<td><input type="date" value="'+isoDia(ts)+'" onchange="editarMarca(\''+mk.id+'\',\'date\',this.value)"></td>'
    +'<td><input type="time" value="'+isoHora(ts)+'" onchange="editarMarca(\''+mk.id+'\',\'time\',this.value)">'+nota+'</td>';
}
function celulaFaltando(idx, rotulo, diaSugerido){
  return '<td><div class="falta">⚠ '+rotulo+'</div><input type="date" id="nd_'+idx+'" value="'+(diaSugerido?isoDia(diaSugerido):'')+'" onchange="completarJornada('+idx+')"></td>'
    +'<td><div class="falta">&nbsp;</div><input type="time" id="nt_'+idx+'" onchange="completarJornada('+idx+')"></td>';
}

function diaSemana(d){ var s=new Date(d).toLocaleDateString('pt-BR',{weekday:'long'}); return s.charAt(0).toUpperCase()+s.slice(1); }
// Ordem do dia: data de entrada → hora de entrada → nome
function ordenarPorDia(rows){
  return rows.slice().sort(function(a,b){
    var da=isoDia(tsDeRow(a)), db=isoDia(tsDeRow(b));
    if(da!==db) return da<db?-1:1;
    if(a.ordem!==b.ordem) return a.ordem-b.ordem;
    return a.nome.localeCompare(b.nome,'pt-BR');
  });
}

function celulaNome(r){
  var outras=r.grafias.filter(function(g){return chaveNome(g)!==chaveNome(r.nome);});
  var h='<b>'+esc(r.nome)+'</b>';
  if(!r.colab) h+=' <span class="badge pend" title="Esse nome ainda não está ligado a ninguém do cadastro">sem cadastro</span>';
  var sub=[];
  if(outras.length) sub.push('no grupo: '+esc(outras.join(', ')));
  if(r.como==='primeiro') sub.push('ligado pelo 1º nome');
  if(sub.length) h+='<div class="tag-dig">'+sub.join(' · ')+'</div>';
  return h;
}

/* ============ VALIDAÇÃO MANUAL (✓ validar / ❓ pontual pro operacional) ============ */
function marcaRev(r){ return r.entrada||r.saida; }
function revDe(r){ return (r.entrada&&r.entrada.rev)||(r.saida&&r.saida.rev)||null; }
function marcarRev(idx, st){
  var r=ULTIMAS[idx]; if(!r) return; if(bloqueado(r.eventoId)) return; var mk=marcaRev(r);
  var atual=revDe(r);
  if(atual && atual.st===st && st==='validado'){ delete mk.rev; if(r.saida&&r.saida!==mk) delete r.saida.rev; salvar(); render(); return; }
  mk.rev={st:st, nota:(atual&&atual.nota)||'', resposta:(atual&&atual.resposta)||'', em:new Date().toISOString()};
  salvar(); render();
  if(st==='pontual'){ setTimeout(function(){ var el=document.getElementById('nota_'+idx); if(el) el.focus(); }, 50); }
}
function setNotaRev(idx, campo, val){ var r=ULTIMAS[idx]; if(!r) return; if(bloqueado(r.eventoId)) return; var rv=revDe(r); if(!rv) return; rv[campo]=val; salvar(); }
function resolverRev(idx){
  var r=ULTIMAS[idx]; if(!r) return; if(bloqueado(r.eventoId)) return; var rv=revDe(r); if(!rv) return;
  rv.st='validado'; rv.resolvido=true; rv.em=new Date().toISOString(); salvar(); render(); toast('✓ Dúvida resolvida — linha validada');
}
function limparRev(idx){ var r=ULTIMAS[idx]; if(!r) return; if(bloqueado(r.eventoId)) return; [r.entrada,r.saida].forEach(function(m){ if(m) delete m.rev; }); salvar(); render(); }
function validarTodasOK(){
  var n=0; ULTIMAS.forEach(function(r){ if(fechamentoDoEvento(r.eventoId)) return; if(!r.alertas.length && r.durMs!=null && !revDe(r)){ marcaRev(r).rev={st:'validado', nota:'', em:new Date().toISOString()}; n++; } });
  salvar(); render(); toast('✓ '+n+' linha(s) OK validadas');
}
function setVer(v){ VER=v; render(); }
function controlesRev(r, idx){
  var rv=r.rev;
  if(rv && rv.st==='pontual'){
    return '<div class="revbox pont"><div style="font-weight:800;font-size:11px;color:#c08cff">❓ Pontual — tirar dúvida com o operacional</div>'
      +'<textarea id="nota_'+idx+'" rows="2" placeholder="Pergunta (ex: o Wesley saiu mesmo 17:15?)" onchange="setNotaRev('+idx+',\'nota\',this.value)">'+esc(rv.nota||'')+'</textarea>'
      +'<input placeholder="Resposta do operacional (opcional)" value="'+esc(rv.resposta||'')+'" onchange="setNotaRev('+idx+',\'resposta\',this.value)">'
      +'<div class="vacts"><button class="btn ghost sm vbtn" onclick="resolverRev('+idx+')">✓ Resolvido</button><a href="#" class="muted" style="font-size:10.5px;align-self:center" onclick="limparRev('+idx+');return false">tirar marcação</a></div></div>';
  }
  if(rv && rv.st==='validado'){
    return '<div class="valid" style="margin-top:4px">✓ Validado por você'+(rv.resolvido?' (dúvida resolvida)':'')+' <a href="#" onclick="limparRev('+idx+');return false">desfazer</a></div>'
      +(rv.nota?'<div class="tag-dig" style="white-space:normal">❓ '+esc(rv.nota)+(rv.resposta?' → '+esc(rv.resposta):'')+'</div>':'');
  }
  return '<div class="vacts"><button class="btn ghost sm vbtn" onclick="marcarRev('+idx+',\'validado\')">✓ Validar</button><button class="btn ghost sm vbtn vpont" onclick="marcarRev('+idx+',\'pontual\')">❓ Pontual</button></div>';
}

// Lista de dúvidas pro operacional: PDF (padrão ILED) e texto pro WhatsApp
function pontuaisAtuais(){ return ordenarPorDia(montarJornadas(filtrar(STORE.marcas))).filter(function(r){ return r.rev && r.rev.st==='pontual'; }); }
function linhaTextoPontual(r){
  var e=r.entrada?tsDe(r.entrada):null, s=r.saida?tsDe(r.saida):null;
  return '• *'+r.nome+'* — '+fmtDia(isoDia(tsDeRow(r)))+(r.fase?' ('+r.fase.toLowerCase()+')':'')+'\n   Entrada: '+(e?fmtDia(isoDia(e))+' '+fmtHora(e):'—')+' | Saída: '+(s?fmtDia(isoDia(s))+' '+fmtHora(s):'—')+(r.durMs!=null?' | '+fmtDuracao(r.durMs):'')
    +'\n   ❓ '+(r.rev.nota||'confirmar horário');
}
function copiarPontuais(){
  var l=pontuaisAtuais(); if(!l.length){ alert('Nenhuma linha marcada como pontual.'); return; }
  var evs={}; l.forEach(function(r){ evs[nomeEvento(r.eventoId)]=1; });
  var txt='*Dúvidas de horário — DP ILED*\n'+Object.keys(evs).join(' / ')+'\n\n'+l.map(linhaTextoPontual).join('\n\n')+'\n\nPode me confirmar? Obrigada!';
  function ok(){ toast('📋 Texto copiado — é só colar no WhatsApp'); }
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, function(){ prompt('Copie o texto:', txt); });
  else prompt('Copie o texto:', txt);
}
function baixarPontuaisPDF(){
  var l=pontuaisAtuais(); if(!l.length){ alert('Nenhuma linha marcada como pontual.'); return; }
  if(!window.jspdf || !window.jspdf.jsPDF || !window.jspdf.jsPDF.API.autoTable){ alert('Não consegui carregar o gerador de PDF (sem internet?). Use o botão "Copiar para o WhatsApp".'); return; }
  var doc=novoPDF(), C=PDF_COR;
  var dias=l.map(function(r){return isoDia(tsDeRow(r));}).sort();
  var cab=function(){ pdfCabecalho(doc,'Dúvidas para o Operacional','Período: '+fmtDia(dias[0])+'/'+dias[0].slice(0,4)+(dias[0]!==dias[dias.length-1]?' a '+fmtDia(dias[dias.length-1])+'/'+dias[dias.length-1].slice(0,4):''),'Emitido em '+fmtDT(new Date())); };
  cab();
  var evs={}; l.forEach(function(r){ evs[nomeEvento(r.eventoId)]=1; });
  pdfTitulo(doc, Object.keys(evs).join(' / ').toUpperCase(), l.length+' registro(s) para confirmar  ·  anote a resposta na última coluna', 43);
  pdfTabela(doc, {startY:54, head:[['Dia','Nome','Entrada','Saída','Jornada','Dúvida','Resposta']],
    body:l.map(function(r){ var e=r.entrada?tsDe(r.entrada):null, s=r.saida?tsDe(r.saida):null;
      return [fmtDia(isoDia(tsDeRow(r)))+(r.fase?'\n'+r.fase:''), r.nome, e?fmtDia(isoDia(e))+' '+fmtHora(e):'—', s?fmtDia(isoDia(s))+' '+fmtHora(s):'—',
        {content:r.durMs!=null?fmtDuracao(r.durMs):'—',styles:{fontStyle:'bold',halign:'right'}}, {content:r.rev.nota||'confirmar horário',styles:{textColor:C.verm}}, r.rev.resposta||'']; }),
    styles:{font:'helvetica', fontSize:7.8, cellPadding:2.2, textColor:C.txt, lineColor:C.linha, lineWidth:.2, valign:'top', fillColor:[255,255,255], minCellHeight:11},
    columnStyles:{0:{cellWidth:22,fontSize:7},1:{cellWidth:30,fontStyle:'bold'},2:{cellWidth:19},3:{cellWidth:19},4:{cellWidth:16},5:{cellWidth:44},6:{cellWidth:'auto'}},
    didDrawPage:function(){ cab(); }});
  pdfRodape(doc);
  doc.save('duvidas_operacional_'+isoDia(new Date())+'.pdf');
}

function celulaConferir(r, idx){
  if(!r.alertasObj.length) return (r.rev?'':'<span class="badge ok">OK</span>')+controlesRev(r, idx);
  return r.alertasObj.map(function(a){
    if(a.validado){
      var desf = a.desfazerHora ? 'desfazerHora(\''+a.desfazerHora+'\')' : 'desfazerValidacao('+idx+',\''+a.cod+'\')';
      return '<div class="valid">✓ '+esc(a.msgOk)+' <a href="#" onclick="'+desf+';return false">desfazer</a></div>';
    }
    var h='<div class="falta" style="font-weight:600;line-height:1.35">⚠ '+esc(a.msg)+'</div>';
    var bts=[];
    if(a.opcoes) a.opcoes.forEach(function(o){ bts.push('<button class="btn ghost sm vbtn" onclick="'+o.fn+'">'+esc(o.rot)+'</button>'); });
    else if(a.msgOk) bts.push('<button class="btn ghost sm vbtn" onclick="validarAlerta('+idx+',\''+a.cod+'\')">✓ Está certo</button>');
    if(bts.length) h+='<div class="vacts">'+bts.join('')+'</div>';
    return h;
  }).join('')+((r.rev && r.rev.st==='pontual') || !r.alertas.length ? controlesRev(r, idx) : '<div class="vacts"><button class="btn ghost sm vbtn vpont" onclick="marcarRev('+idx+',\'pontual\')">❓ Pontual</button></div>');
}

function linhaJornada(r, idx, verEv, LIMITE){
  var orfa = r.durMs==null, marcar = orfa || r.alertas.length>0;
  var cls = (r.rev&&r.rev.st==='pontual') ? 'pontual' : (marcar ? 'orfa' : ((r.validados.length||(r.rev&&r.rev.st==='validado'))?'validada':''));
  return '<tr'+(cls?' class="'+cls+'"':'')+'>'
    +(verEv?'<td><span class="evtag">'+esc(nomeEvento(r.eventoId))+'</span></td>':'')
    +'<td>'+celulaNome(r)+'</td>'
    +'<td><span class="muted" style="font-size:11.5px">'+esc(r.equipe||'—')+'</span>'+(r.fase?'<div style="margin-top:3px"><span class="fase '+classeFase(r.fase)+'">'+esc(r.fase)+'</span></div>':'')+'</td>'
    +(r.entrada?celulaMarca(r.entrada):celulaFaltando(idx,'falta entrada', r.saida?tsDe(r.saida):null))
    +(r.saida?celulaMarca(r.saida):celulaFaltando(idx,'falta saída', r.entrada?tsDe(r.entrada):null))
    +'<td>'+(orfa?'<span class="muted">—</span>':'<span class="jorn">'+fmtDuracao(r.durMs)+'</span>'+(r.durMs>LIMITE?' <span class="badge dobra">+'+fmtDuracao(r.durMs-LIMITE)+'</span>':''))+'</td>'
    +'<td style="min-width:'+((r.alertasObj.length||(r.rev&&r.rev.st==='pontual'))?'250':'120')+'px;max-width:290px">'+celulaConferir(r, idx)+'</td>'
    +'<td><button class="btn ghost sm" onclick="delJornada('+idx+')" title="Remover">✕</button></td>'
    +'</tr>';
}

// Quadro sempre visível: cada evento da tela, se está pronto e o botão de fechar
function renderPainelFechamento(todas){
  var ids=[]; todas.forEach(function(r){ if(ids.indexOf(r.eventoId)<0) ids.push(r.eventoId); });
  if(!ids.length) return '';
  var h='<div class="card" style="border-top:3px solid var(--red)"><div class="section-title">🔒 Fechamento do evento</div>'
    +'<div class="muted" style="font-size:11.5px;margin-bottom:10px">Quando tudo estiver validado, feche o evento: ele vai para o 🗄 Banco de dados e não pode mais ser alterado (só com adendo). Se alguma coisa não tiver como resolver (ex: alguém não registrou no grupo), dá para fechar mesmo assim registrando uma observação.</div>';
  ids.forEach(function(id){
    var rs=todas.filter(function(r){return r.eventoId===id;});
    var av=rs.filter(function(r){return r.alertas.length;}).length, pt=rs.filter(function(r){return r.rev&&r.rev.st==='pontual';}).length;
    var nv=rs.filter(function(r){return !r.alertas.length && !(r.rev&&r.rev.st==='validado');}).length;
    var tot=rs.reduce(function(s,r){return s+(r.durMs||0);},0);
    var pronto=!av && !pt;
    h+='<div class="flex" style="justify-content:space-between;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;margin-bottom:8px;background:'+(pronto?'rgba(61,220,132,.05)':'rgba(255,176,32,.05)')+'">'
      +'<div><b>'+esc(nomeEvento(id))+'</b><div class="muted" style="font-size:11.5px;margin-top:3px">'+rs.length+' jornada(s) · '+fmtDuracao(tot)+' · '
      +(pronto ? '<span style="color:var(--grn);font-weight:700">✓ pronto para fechar</span>'+(nv?' ('+nv+' linha(s) OK ainda sem validar — serão validadas no fechamento)':'')
               : '<span style="color:var(--amber);font-weight:700">'+(av?av+' aviso(s) ⚠ ':'')+(pt?pt+' dúvida(s) ❓ ':'')+'— resolva, ou feche com observação</span>')
      +'</div></div>'
      +'<button class="btn" '+(pronto?'':'style="background:#3a2a10;border:1px solid var(--amber);box-shadow:none"')+' onclick="fecharEvento(\''+id+'\')">🔒 Fechar evento'+(pronto?'':' com observação')+'</button></div>';
  });
  return h+'</div>';
}

/* ---- Exportar fotos como .zip (com manifesto de anotações) ---- */
function exportarFotos(somenteMarcadas){
  var fotos = filtrar(STORE.fotos).filter(function(f){ return somenteMarcadas ? f.marcado : true; });
  if(!fotos.length){ alert(somenteMarcadas ? 'Nenhuma foto marcada como comprovante ainda.' : 'Nenhuma foto pra exportar.'); return; }
  var zip = new JSZip();
  var manifest = [['arquivo','evento','remetente','data_hora','marcado_comprovante','nota'].map(csvCell).join(';')];
  var usados = {};
  var pendentes = fotos.length;
  fotos.forEach(function(f){
    fetch(f.url).then(function(r){ return r.blob(); }).then(function(blob){
      var base = (f.sender+'_'+new Date(f.date).toISOString().slice(0,16).replace(/[:T]/g,'-')+'_'+f.filename).replace(/[\\/:*?"<>|]/g,'_');
      var nome = base; var n=1;
      while(usados[nome]){ nome = (n++)+'_'+base; }
      usados[nome]=true;
      zip.file(nome, blob);
      manifest.push([nome, nomeEvento(f.eventoId), f.sender, fmtDT(f.date), f.marcado?'sim':'não', f.nota||''].map(csvCell).join(';'));
      pendentes--;
      if(pendentes===0){
        zip.file('comprovantes.csv', manifest.join('\n'));
        zip.generateAsync({type:'blob'}).then(function(zipBlob){
          var a=document.createElement('a');
          a.href=URL.createObjectURL(zipBlob);
          a.download=(somenteMarcadas?'comprovantes_marcados':'comprovantes_todos')+'.zip';
          a.click();
        });
      }
    });
  });
}

/* ============ PARTÍCULAS DE FUNDO ============ */
(function(){
  var cv=document.getElementById('bg'); if(!cv)return; var cx=cv.getContext('2d');
  var W,H,parts=[],DPR=Math.min(window.devicePixelRatio||1,2);
  function resize(){ W=window.innerWidth; H=window.innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; cx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener('resize',resize); resize();
  var N=Math.max(24,Math.min(42,Math.round(W/38)));
  function rnd(a,b){ return a+Math.random()*(b-a); }
  for(var i=0;i<N;i++){
    var big=Math.random()<.30;
    parts.push({ x:Math.random()*W, y:Math.random()*H, r:big?rnd(5,9):rnd(2,4.5), halo:big?rnd(22,40):rnd(10,20),
      vx:rnd(-.28,.28), vy:rnd(-.28,.28), base:big?rnd(.5,.85):rnd(.35,.6), tw:rnd(.4,1.2), ph:Math.random()*Math.PI*2, hot:Math.random()<.5 });
  }
  var t=0;
  function loop(){
    t+=0.016; cx.clearRect(0,0,W,H); cx.globalCompositeOperation='lighter';
    for(var i=0;i<parts.length;i++){
      var p=parts[i]; p.x+=p.vx; p.y+=p.vy;
      if(p.x<-40)p.x=W+40; if(p.x>W+40)p.x=-40; if(p.y<-40)p.y=H+40; if(p.y>H+40)p.y=-40;
      var k=p.base*(0.7+0.3*Math.sin(t*p.tw+p.ph));
      var cr=p.hot?'255,70,90':'225,10,10', mid=p.hot?'255,31,68':'225,6,0';
      var g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.halo);
      g.addColorStop(0,'rgba('+mid+','+(k*0.55)+')'); g.addColorStop(0.4,'rgba('+mid+','+(k*0.18)+')'); g.addColorStop(1,'rgba('+mid+',0)');
      cx.fillStyle=g; cx.beginPath(); cx.arc(p.x,p.y,p.halo,0,Math.PI*2); cx.fill();
      var g2=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
      g2.addColorStop(0,'rgba(255,235,235,'+Math.min(1,k+0.35)+')'); g2.addColorStop(0.5,'rgba('+cr+','+Math.min(1,k+0.15)+')'); g2.addColorStop(1,'rgba('+mid+',0)');
      cx.fillStyle=g2; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,Math.PI*2); cx.fill();
    }
    cx.globalCompositeOperation='source-over'; requestAnimationFrame(loop);
  }
  loop();
})();

function salvarXlsx(wb, nome){
  try{ if(PASTA && PASTA_PERM==='granted'){ var out=XLSX.write(wb,{bookType:'xlsx',type:'array'}); gravarNaPasta('relatorio', nome, new Blob([out],{type:'application/octet-stream'}), mesDoNome(nome)||AGENDA_MES); } }catch(e){}
  XLSX.writeFile(wb, nome);
}
/* ============ PASTA DO PC: backup semanal automático + cópia de tudo que entra e sai ============ */
// Conecta-se uma vez a pasta "WHATSAPP EVENTOS - ILED" (Chrome do computador). Depois o programa grava sozinho:
// 04_BACKUPS (backup .json a cada 7 dias) · 05_PLANILHAS_CRONOGRAMA · 06_CONVERSAS_WHATSAPP/<mês> · 07_RELATORIOS_GERADOS/<mês>
var PASTA=null, PASTA_PERM='', PASTA_DIAS=7;
var PASTA_SUB={ backup:['04_BACKUPS'], planilha:['05_PLANILHAS_CRONOGRAMA'], conversa:['06_CONVERSAS_WHATSAPP'], relatorio:['07_RELATORIOS_GERADOS'] };
function pastaSuportada(){ return !!(window.showDirectoryPicker && window.indexedDB); }
function pastaIDB(modo, valor){
  return new Promise(function(ok){
    try{
      var r=indexedDB.open('wa_iled_pasta',1);
      r.onupgradeneeded=function(){ r.result.createObjectStore('h'); };
      r.onerror=function(){ ok(null); };
      r.onsuccess=function(){
        try{
          var tx=r.result.transaction('h', modo==='get'?'readonly':'readwrite'), st=tx.objectStore('h');
          var q = modo==='get' ? st.get('raiz') : (modo==='del' ? st.delete('raiz') : st.put(valor,'raiz'));
          q.onsuccess=function(){ ok(modo==='get'?q.result:true); }; q.onerror=function(){ ok(null); };
        }catch(e){ console.warn('Pasta do PC: não lembrei a pasta', e); ok(null); }
      };
    }catch(e){ ok(null); }
  });
}
function ultimoBackupPasta(){ try{ return localStorage.getItem('wa_pasta_ultimo_backup')||''; }catch(e){ return ''; } }
function diasDesdeBackup(){ var u=ultimoBackupPasta(); return u ? Math.floor((Date.now()-new Date(u).getTime())/86400000) : 9999; }
function nomeSeguro(n){ return String(n||'arquivo').replace(/[\\\/:*?"<>|\u0000-\u001f]+/g,'-').replace(/\s+/g,' ').trim().slice(0,150); }
function mesDoNome(n){ var m=String(n||'').match(/(20\d\d)-(0[1-9]|1[0-2])/); return m ? m[1]+'-'+m[2] : ''; }
function pastaMes(mes){ var q=(mes||isoDia(new Date()).slice(0,7)).split('-'); return q[0]+'-'+q[1]+'_'+MESES_NOME[+q[1]-1].toUpperCase(); }
function pastaPermissao(pedir){
  if(!PASTA) return Promise.resolve(false);
  var o={mode:'readwrite'};
  return Promise.resolve(PASTA.queryPermission ? PASTA.queryPermission(o) : 'granted').then(function(st){
    if(st==='granted' || !pedir) return st;
    return PASTA.requestPermission(o);
  }).then(function(st){ PASTA_PERM=st; atualizarAvisoPasta(); return st==='granted'; }).catch(function(){ return false; });
}
function conectarPasta(){
  if(!pastaSuportada()){ alert('Esse recurso funciona no Google Chrome (ou Edge) do computador.'); return; }
  window.showDirectoryPicker({id:'wa_iled_pasta', mode:'readwrite'}).then(function(h){
    if(/^0\d_/.test(h.name) && !confirm('Você escolheu a pasta "'+h.name+'".\n\nO certo é escolher a pasta PRINCIPAL "WHATSAPP EVENTOS - ILED" (a que tem 01_PROGRAMA, 04_BACKUPS...).\n\nUsar mesmo assim?')) return;
    PASTA=h; PASTA_PERM='granted';
    return pastaIDB('put', h).then(function(){
      toast('📁 Pasta "'+h.name+'" conectada');
      return fazerBackupPasta(true);
    });
  }).catch(function(e){ if(e && e.name!=='AbortError') alert('Não consegui conectar a pasta: '+e.message); }).then(function(){ render(); });
}
function desconectarPasta(){
  if(!confirm('Desconectar a pasta do PC? Nada é apagado; o programa só para de salvar lá.')) return;
  PASTA=null; PASTA_PERM=''; pastaIDB('del').then(function(){ atualizarAvisoPasta(); render(); });
}
// grava um arquivo dentro da pasta (cria as subpastas se faltarem). Nunca trava o programa: se falhar, só avisa no console.
function gravarNaPasta(sub, nome, blob, mes){
  if(!PASTA || PASTA_PERM!=='granted' || !blob) return Promise.resolve(false);
  var caminho=(PASTA_SUB[sub]||[sub]).slice();
  if(sub==='conversa' || sub==='relatorio') caminho.push(pastaMes(mes));
  var dir=Promise.resolve(PASTA);
  caminho.forEach(function(c){ dir=dir.then(function(d){ return d.getDirectoryHandle(c,{create:true}); }); });
  return dir.then(function(d){ return d.getFileHandle(nomeSeguro(nome),{create:true}); })
    .then(function(fh){ return fh.createWritable(); })
    .then(function(w){ return w.write(blob).then(function(){ return w.close(); }); })
    .then(function(){ return true; })
    .catch(function(e){ console.warn('Pasta do PC: não gravou '+nome, e); return false; });
}
function dadosBackup(){
  return {versao:5,geradoEm:new Date().toISOString(),eventos:STORE.eventos,marcas:STORE.marcas,financeiro:STORE.financeiro,colaboradores:STORE.colaboradores,agendas:STORE.agendas,fechamentos:STORE.fechamentos,apelidos:STORE.apelidos};
}
function fazerBackupPasta(manual){
  var ir = manual ? pastaPermissao(true) : Promise.resolve(PASTA_PERM==='granted');
  return ir.then(function(ok){
    if(!ok){ if(manual) alert('O Chrome não liberou a pasta. Clique em "Permitir" quando ele perguntar.'); return false; }
    var blob=new Blob([JSON.stringify(dadosBackup(),null,2)],{type:'application/json'});
    var nome='whatsapp_eventos_iled_backup_'+isoDia(new Date())+'.json';
    return gravarNaPasta('backup', nome, blob).then(function(g){
      if(g){ try{ localStorage.setItem('wa_pasta_ultimo_backup', new Date().toISOString()); }catch(e){}
        toast('💾 Backup salvo em 04_BACKUPS ('+nome+')'); }
      else if(manual) alert('Não consegui gravar o backup na pasta. Confira se a pasta ainda existe e conecte de novo.');
      atualizarAvisoPasta(); if(TAB==='banco') render(); return g;
    });
  });
}
// ao abrir o programa: se já passou 1 semana, faz o backup sozinho (ou mostra um aviso de 1 clique, se o Chrome pedir permissão)
function checarBackupSemanal(){
  if(!PASTA) return Promise.resolve();
  return pastaPermissao(false).then(function(ok){
    if(diasDesdeBackup()<PASTA_DIAS) return;
    if(ok) return fazerBackupPasta(false);
    atualizarAvisoPasta();
  });
}
function atualizarAvisoPasta(){
  var el=document.getElementById('avisoPasta');
  if(!el){ el=document.createElement('div'); el.id='avisoPasta'; document.body.appendChild(el); }
  var precisa = PASTA && (PASTA_PERM!=='granted' || diasDesdeBackup()>=PASTA_DIAS);
  if(!precisa){ el.style.display='none'; return; }
  el.style.cssText='display:flex;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;gap:10px;align-items:center;background:#141419;color:#fff;border:2px solid #e00500;border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.35);max-width:92vw';
  el.innerHTML='<span>💾 '+(diasDesdeBackup()>=PASTA_DIAS?'Hora do <b>backup semanal</b> na pasta do PC':'Libere a <b>pasta do PC</b> para o programa salvar seus arquivos')+'</span>'
    +'<button class="btn sm" onclick="fazerBackupPasta(true)">Salvar agora</button>'
    +'<button class="btn ghost sm" style="color:#fff" onclick="this.parentNode.style.display=\'none\'">Depois</button>';
}
function cardPasta(){
  var h='<div class="card" style="border-top:3px solid '+(PASTA&&PASTA_PERM==='granted'?'var(--grn)':'var(--amber)')+'">'
    +'<div class="section-title" style="margin-bottom:4px">📁 Pasta do PC e backup automático</div>';
  if(!pastaSuportada()) return h+'<div class="muted" style="font-size:12.5px">Disponível só no <b style="color:var(--txt)">Chrome do computador</b>. No celular os dados continuam salvos na nuvem normalmente.</div></div>';
  var u=ultimoBackupPasta(), d=diasDesdeBackup();
  if(!PASTA){
    return h+'<div class="muted" style="font-size:12.5px;line-height:1.55;margin-bottom:10px">Conecte <b style="color:var(--txt)">uma vez</b> a pasta <b style="color:var(--txt)">WHATSAPP EVENTOS - ILED</b> do seu computador. A partir daí o programa salva sozinho:<br>'
      +'💾 <b style="color:var(--txt)">backup semanal</b> em 04_BACKUPS · 📊 a <b style="color:var(--txt)">planilha do mês</b> em 05 · 💬 as <b style="color:var(--txt)">conversas</b> em 06 · 📄 os <b style="color:var(--txt)">PDFs e planilhas gerados</b> em 07 (uma pasta por mês).</div>'
      +'<button class="btn" onclick="conectarPasta()">📁 Conectar pasta do projeto</button></div>';
  }
  h+='<div class="flex" style="justify-content:space-between;align-items:center">'
    +'<div style="font-size:12.5px;line-height:1.6">Pasta: <b>'+esc(PASTA.name)+'</b> '+(PASTA_PERM==='granted'?'<span class="badge ok">liberada</span>':'<span class="badge pend">precisa liberar</span>')
    +'<br>Último backup: <b>'+(u?fmtDT(u)+' ('+(d===0?'hoje':d+' dia(s) atrás')+')':'nenhum ainda')+'</b> · próximo: '+(u?(d>=PASTA_DIAS?'<b style="color:var(--amber)">agora</b>':'em '+(PASTA_DIAS-d)+' dia(s)'):'<b style="color:var(--amber)">agora</b>')+'</div>'
    +'<div class="flex">'+(PASTA_PERM!=='granted'?'<button class="btn sm" onclick="pastaPermissao(true).then(function(){render();})">🔓 Liberar pasta</button>':'')
      +'<button class="btn sm" onclick="fazerBackupPasta(true)">💾 Backup agora</button>'
      +'<button class="btn ghost sm" onclick="conectarPasta()">Trocar pasta</button>'
      +'<button class="btn ghost sm" onclick="desconectarPasta()">Desconectar</button></div></div>'
    +'<div class="muted" style="font-size:11px;margin-top:8px">O Chrome pode perguntar se permite o site editar a pasta: escolha <b>"Permitir em todas as visitas"</b> para o backup semanal acontecer sem precisar clicar.</div>';
  return h+'</div>';
}
function iniciarPasta(){
  if(!pastaSuportada()) return Promise.resolve();
  return pastaIDB('get').then(function(h){ if(h){ PASTA=h; return checarBackupSemanal(); } }).then(function(){ if(TAB==='banco') render(); });
}
