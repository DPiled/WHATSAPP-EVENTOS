<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsApp Eventos — ILED (v2 Jornadas)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#0a0b0f;--bg2:#111319;--panel:#14161d;--panel2:#171922;--panelh:#1b1e28;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --txt:#eef0f5;--mut:#9aa0af;--mut2:#6b7180;
  --red:#e10600;--red2:#ff1f44;--grn:#3ddc84;--amber:#ffb020;--blue:#4f8cff;
  --shadow:0 12px 40px rgba(0,0,0,.5);
  --glass:rgba(24,26,34,.55);--glass-hi:rgba(255,255,255,.06);
  --glass-bd:rgba(255,255,255,.12);
  --glass-sh:0 10px 34px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.10);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);color:var(--txt);font-size:14px;
  background:
    radial-gradient(1200px 600px at 85% -10%,rgba(225,6,0,.16),transparent 60%),
    radial-gradient(900px 520px at 0% 0%,rgba(255,31,68,.10),transparent 55%),
    #0a0b0f;
  min-height:100vh;
}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.subbar{height:4px;width:100%;display:flex;position:sticky;top:0;z-index:50}
.subbar span{flex:1}
.subbar span:nth-child(1){background:var(--red)}
.subbar span:nth-child(2){background:var(--amber)}
.subbar span:nth-child(3){background:#e9ecf5}
.subbar span:nth-child(4){background:var(--blue)}
header,nav.tabs,main{position:relative;z-index:1}
header{display:flex;align-items:center;gap:16px;padding:14px 22px;flex-wrap:wrap}
.logo-mark{
  width:44px;height:44px;border-radius:12px;flex:none;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;
  background:linear-gradient(160deg,var(--red),var(--red2));color:#fff;
  box-shadow:0 0 16px rgba(225,6,0,.55),0 0 34px rgba(225,6,0,.25);
  animation:pulseglow 4s ease-in-out infinite;
}
@keyframes pulseglow{
  0%,100%{box-shadow:0 0 16px rgba(225,6,0,.55),0 0 34px rgba(225,6,0,.25)}
  50%{box-shadow:0 0 10px rgba(225,6,0,.35),0 0 20px rgba(225,6,0,.15)}
}
.htitle{font-weight:800;letter-spacing:-.4px;font-size:18px;line-height:1}
.hsub{color:var(--mut);font-size:12px;margin-top:3px}
.hcenter{display:flex;flex-direction:column}
.evsel{margin-left:auto;display:flex;gap:10px;align-items:center}
.evsel select{min-width:180px}
nav.tabs{display:flex;gap:4px;padding:0 18px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav.tabs button{
  background:none;border:none;padding:11px 16px;cursor:pointer;color:var(--mut);
  font-weight:600;font-size:13px;border-bottom:2px solid transparent;font-family:inherit;
}
nav.tabs button.active{color:var(--txt);border-bottom-color:var(--red)}
main{padding:20px 26px 60px;max-width:1180px;width:100%;margin:0 auto}
.panel,.card{
  background:linear-gradient(180deg,var(--glass-hi) 0%,var(--glass) 100%);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid var(--glass-bd);border-top:1px solid rgba(255,255,255,.18);
  border-radius:14px;box-shadow:var(--glass-sh);
}
.card{padding:16px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:16px}
.kpi .eye{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut)}
.kpi .big{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:6px}
.kpi .desc{font-size:11.5px;color:var(--mut);margin-top:3px}
.kpi.hero{border-top:3px solid var(--red);background:linear-gradient(180deg,rgba(225,6,0,.14),var(--glass))}
.section-title{font-weight:800;font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.section-title .n{background:var(--red);color:#fff;border-radius:7px;font-size:11px;padding:1px 7px;font-weight:800}
.muted{color:var(--mut)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input,select,textarea{
  font-family:inherit;font-size:13px;color:var(--txt);background:rgba(255,255,255,.04);
  border:1px solid var(--line2);border-radius:9px;padding:8px 10px;outline:none;
}
textarea{width:100%;resize:vertical;line-height:1.55;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
input::placeholder,textarea::placeholder{color:var(--mut2)}
input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 2px rgba(225,6,0,.25)}
select option{background:#14161d;color:var(--txt)}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mut);font-weight:600;margin-bottom:12px}
.money-wrap{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:9px;padding:0 8px}
.money-wrap:focus-within{border-color:var(--red);box-shadow:0 0 0 2px rgba(225,6,0,.25)}
.money-wrap .money-prefix{color:var(--mut2);font-size:11.5px;font-weight:700;flex:none}
.money-wrap input.money-input{border:none!important;background:transparent!important;box-shadow:none!important;padding:8px 0!important;text-align:right;width:100%;min-width:70px;font-variant-numeric:tabular-nums}
.btn{
  border:none;border-radius:10px;padding:9px 15px;font-weight:700;font-size:13px;
  cursor:pointer;font-family:inherit;background:var(--red);color:#fff;box-shadow:0 6px 18px rgba(225,6,0,.4);
}
.btn.ghost{background:rgba(255,255,255,.05);color:var(--txt);border:1px solid var(--line2);box-shadow:none}
.btn.ghost.active{background:rgba(79,140,255,.16);color:#7aa8ff;border-color:rgba(79,140,255,.4)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:800;letter-spacing:.3px}
.badge.dobra{background:rgba(225,6,0,.18);color:#ff8b8b;border:1px solid rgba(225,6,0,.4)}
.badge.ok{background:rgba(61,220,132,.15);color:var(--grn);border:1px solid rgba(61,220,132,.35)}
.badge.pend{background:rgba(255,176,32,.15);color:var(--amber);border:1px solid rgba(255,176,32,.35)}
.tablewrap{overflow:auto;border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{
  background:var(--panelh);color:var(--mut);text-transform:uppercase;font-size:10px;
  letter-spacing:.8px;padding:9px 10px;text-align:left;position:sticky;top:0;white-space:nowrap;
}
td{padding:7px 10px;border-bottom:1px solid var(--line);color:var(--txt)}
tr:nth-child(even) td{background:rgba(255,255,255,.025)}
tr:hover td{background:rgba(255,255,255,.05)}
td input,td select{border:1px solid transparent;background:transparent;padding:5px 6px;width:100%;min-width:70px;border-radius:6px;color:var(--txt)}
td input:hover,td select:hover{border-color:var(--line2)}
td input:focus,td select:focus{border-color:var(--red);background:rgba(255,255,255,.06)}
.trecho{max-width:320px;white-space:normal;color:var(--mut);font-size:11.5px;line-height:1.4}
.empty{padding:34px 16px;text-align:center;color:var(--mut2);font-size:13px}
.dropzone{
  border:1.5px dashed var(--line2);border-radius:12px;padding:22px;text-align:center;
  color:var(--mut);font-size:12.5px;cursor:pointer;transition:.15s;
}
.dropzone:hover,.dropzone.over{border-color:var(--red);background:rgba(225,6,0,.06);color:var(--txt)}
.dropzone input{display:none}
.step-num{
  display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--red);color:#fff;font-weight:800;font-size:11px;margin-right:8px;flex:none;
}
.fotos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.foto-card{overflow:hidden}
.foto-card .thumb{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;cursor:zoom-in;display:block;background:var(--bg2)}
.foto-card .meta{margin-top:8px;font-size:11px;color:var(--mut)}
.foto-card .meta b{color:var(--txt)}
.foto-card .chk{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11.5px;font-weight:600}
.foto-card input[type=checkbox]{width:15px;height:15px;accent-color:var(--red)}
.foto-card .nota{margin-top:6px;width:100%}
.overlay{position:fixed;inset:0;background:rgba(6,7,10,.78);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:200;padding:24px}
.overlay.show{display:flex}
.overlay img{max-width:92vw;max-height:88vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.overlay .ovclose{position:absolute;top:20px;right:26px;background:rgba(255,255,255,.08);border:1px solid var(--line2);color:#fff;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:18px}
.foot-note{margin-top:18px;font-size:11px;color:var(--mut2);line-height:1.6}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.evtag{display:inline-block;background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:7px;padding:2px 8px;font-size:11px;color:var(--mut)}
/* ---- ajustes v2 (jornadas) ---- */
td input[type=date]{min-width:128px}
td input[type=time]{min-width:86px}
.tag-dig{font-size:10px;color:var(--mut2);margin-top:2px;white-space:nowrap}
.tag-dig.man{color:#7aa8ff}
tr.orfa td{background:rgba(255,176,32,.07)!important}
.falta{font-size:10.5px;color:var(--amber);font-weight:700;margin-bottom:3px}
.jorn{font-weight:800;font-variant-numeric:tabular-nums;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:20px;padding:3px 10px;font-size:11.5px}
.chip b{color:var(--amber)}
tr.pontual td{background:rgba(160,100,255,.08)!important}
.revbox{display:flex;flex-direction:column;gap:5px;margin-top:6px;padding:7px;border-radius:9px;border:1px solid rgba(160,100,255,.4);background:rgba(160,100,255,.07)}
.revbox textarea,.revbox input{font-family:inherit;font-size:11.5px;padding:5px 7px;min-width:0;width:100%}
.vpont:hover{border-color:#c08cff!important;color:#c08cff!important}
tr.validada td{background:rgba(79,140,255,.06)!important}
.valid{font-size:10.5px;color:#7aa8ff;font-weight:700;line-height:1.35;margin-bottom:3px}
.valid a{color:var(--mut2);font-weight:500;margin-left:4px}
.vacts{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 6px}
.vbtn{padding:4px 8px!important;font-size:11px!important}
.vbtn:hover{border-color:var(--grn);color:var(--grn)}
.modal{position:fixed;inset:0;background:rgba(6,7,10,.75);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;z-index:300;padding:40px 16px;overflow:auto}
.modal .card{max-width:620px;width:100%}
.diasbox{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.diasbox label{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:9px;padding:7px 10px;font-size:12.5px;cursor:pointer}
.diasbox input{accent-color:var(--red)}
tr.dayhdr td{background:linear-gradient(90deg,rgba(225,6,0,.22),rgba(225,6,0,.04))!important;font-weight:800;font-size:13px;padding:11px 12px;border-top:2px solid rgba(225,6,0,.5);letter-spacing:-.1px}
.dstat{font-weight:600;font-size:11.5px;color:var(--mut);margin-left:12px}
.agdias{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.agdia{display:flex;flex-direction:column;gap:2px;min-width:92px;padding:6px 8px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:11px;cursor:help}
.agdia b{font-size:11.5px}
.fase{font-size:9.5px;font-weight:800;letter-spacing:.3px;padding:1px 5px;border-radius:5px;background:rgba(255,255,255,.07);color:var(--mut);align-self:flex-start;white-space:normal}
.f-mon{background:rgba(255,176,32,.16);color:var(--amber)}.f-eve{background:rgba(61,220,132,.15);color:var(--grn)}.f-des{background:rgba(255,31,68,.16);color:#ff7d93}.f-evd{background:rgba(79,140,255,.16);color:#7aa8ff}.f-log{background:rgba(255,255,255,.06);color:var(--mut)}
.logo-img{height:46px;width:auto;border-radius:9px;flex:none;box-shadow:0 0 18px rgba(225,6,0,.25)}
.nuvem{font-size:11.5px;font-weight:700;border:1px solid var(--line2);border-radius:20px;padding:5px 11px;cursor:pointer;white-space:nowrap}
@media(max-width:700px){
  header{padding:10px 12px;gap:10px} .hsub{display:none} .htitle{font-size:15px}
  .evsel{margin-left:0;width:100%;flex-wrap:wrap} .evsel select{flex:1;min-width:0}
  nav.tabs{flex-wrap:nowrap;overflow-x:auto;padding:0 8px} nav.tabs button{white-space:nowrap;padding:10px 11px}
  main{padding:12px 10px 50px} .card{padding:12px} .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .toolbar > *{flex:1 1 100%} .modal{padding:12px}
}
.prog{height:7px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden;margin:8px 0 6px;max-width:420px}
.prog div{height:100%;background:linear-gradient(90deg,var(--red),#3ddc84);border-radius:6px;transition:width .4s}
.agrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;border-bottom:1px solid var(--line)}
.agrow:hover{background:rgba(255,255,255,.035)} .agrow.open{background:rgba(255,255,255,.05);border-bottom-color:transparent}
.agmain{display:flex;gap:10px;align-items:center;min-width:0;flex:1}
.agnome{font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agside{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.agdet{padding:4px 12px 14px 52px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:0 0 10px 10px;margin-bottom:4px}
.ufb{flex:none;width:32px;text-align:center;font-size:10.5px;font-weight:800;padding:4px 0;border-radius:7px;background:rgba(255,255,255,.07);border:1px solid var(--line2)}
.pill{font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap}
.p-ok{background:rgba(61,220,132,.13);color:var(--grn);border:1px solid rgba(61,220,132,.35)}
.p-warn{background:rgba(255,176,32,.13);color:var(--amber);border:1px solid rgba(255,176,32,.35)}
.p-blue{background:rgba(79,140,255,.14);color:#7aa8ff;border:1px solid rgba(79,140,255,.35)}
.p-todo{background:rgba(255,255,255,.05);color:var(--mut);border:1px solid var(--line2)}
@media(max-width:700px){ .agrow{flex-wrap:wrap} .agside{width:100%;justify-content:flex-start;padding-left:42px} .agdet{padding-left:12px} .agnome{white-space:normal} }
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="subbar"><span></span><span></span><span></span><span></span></div>
<header>
  <img class="logo-img" src="" id="logoTopo" alt="ILED Produções">
  <div class="hcenter">
    <div class="htitle">WHATSAPP EVENTOS · ILED</div>
    <div class="hsub">Jornadas das equipes por evento · DP</div>
  </div>
  <div class="evsel">
    <span id="nuvem" class="nuvem">☁</span>
    <select id="evFiltro" onchange="setFiltroEvento(this.value)"></select>
  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>

<div class="overlay" id="lightbox"><button class="ovclose" onclick="closeLightbox()">✕</button><img id="lightboxImg" src=""></div>

<script>
/* ============ ESTADO ============ */
var APELIDOS_PADRAO = 'Igor = Igo\nLéo = Leonardo\nRepert = Rupert';
var STORE = { eventos:[], marcas:[], financeiro:[], fotos:[], colaboradores:[], agendas:{}, fechamentos:[], apelidos:APELIDOS_PADRAO, horaBase:'digitada', visao:'dia' };
var AGENDA_MES=null, BUSCA_A='', AG_TODOS=false;
var TAB='agenda', FILTRO_EV='todos', BUSCA='', BUSCA_C='', SO_CONFERIR=false, VER='todas';
var DATEFMT = 'auto'; // 'auto' | 'br' | 'us'
var FMT_ATUAL = 'br';
var ULTIMAS = []; // últimas jornadas renderizadas (para edição inline)

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fmtDT(d){ if(!d) return ''; var dt=new Date(d); return dt.toLocaleDateString('pt-BR')+' '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function fmtData(d){ return new Date(d).toLocaleDateString('pt-BR'); }
function fmtHora(d){ return new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function pad2(n){ return (n<10?'0':'')+n; }
function isoDia(d){ d=new Date(d); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function isoHora(d){ d=new Date(d); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function fmtMoney(v){ v=parseFloat(v||0); return 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }

/* ============ PERSISTÊNCIA (localStorage — fotos ficam só na memória da sessão) ============ */
function salvar(){
  try{
    localStorage.setItem('wa_eventos_iled', JSON.stringify({
      versao:4, eventos:STORE.eventos, marcas:STORE.marcas, financeiro:STORE.financeiro, colaboradores:STORE.colaboradores, agendas:STORE.agendas, fechamentos:STORE.fechamentos, ultimaSync:STORE.ultimaSync,
      apelidos:STORE.apelidos, horaBase:STORE.horaBase, visao:STORE.visao
    }));
  }catch(e){ console.warn('Falha ao salvar localStorage', e); }
  if(typeof agendarEnvioEstado==='function') agendarEnvioEstado();
}
function carregar(){
  try{
    var raw = localStorage.getItem('wa_eventos_iled');
    if(!raw) return;
    var d = JSON.parse(raw);
    STORE.eventos = d.eventos||[];
    STORE.financeiro = [];
    if(typeof d.apelidos==='string') STORE.apelidos = d.apelidos;
    if(d.horaBase) STORE.horaBase = d.horaBase;
    if(d.visao) STORE.visao = d.visao;
    STORE.colaboradores = d.colaboradores||[];
    STORE.agendas = d.agendas||{};
    STORE.fechamentos = d.fechamentos||[]; STORE.ultimaSync = d.ultimaSync||null;
    STORE.marcas = d.marcas||[];
    // migração da versão antiga (linhas prontas de horário → marcações de entrada/saída)
    if(!d.marcas && d.horarios){
      d.horarios.forEach(function(r){
        STORE.marcas.push({id:uid(), eventoId:r.eventoId, nome:r.nome, tipo:'in',  tsEnvio:r.entrada, tsDigitada:null, remetente:''});
        STORE.marcas.push({id:uid(), eventoId:r.eventoId, nome:r.nome, tipo:'out', tsEnvio:r.saida,   tsDigitada:null, remetente:''});
      });
    }
  }catch(e){}
}

/* ============ PARSER DE CONVERSA EXPORTADA DO WHATSAPP ============ */
// Aceita: [dd/mm/aaaa, hh:mm:ss] Nome: msg | dd/mm/aaaa, hh:mm - Nome: msg | com AM/PM | export em .md
var LINE_RE = /^\[?(\d{1,4}\/\d{1,2}\/\d{1,4}),?\s+(\d{1,2}:\d{2}(?::\d{2})?(?:\s?[APap]\.?\s?[Mm]\.?)?)\]?\s*[-—]?\s*(.*)$/;

// Descobre sozinho se o arquivo está em dd/mm (Brasil) ou mm/dd (celular em inglês)
// Descobre se o arquivo está em dd/mm (Brasil) ou mm/dd (celular em inglês)
// 1) dia > 12 decide sozinho  2) mês do evento da agenda  3) o jeito em que a conversa dura menos (grupo dura dias, não meses)  4) AM/PM = celular em inglês
var DICA_MES=null;
function detectarFormatoData(lines){
  var br=0, us=0, pares=[], ampm=0;
  lines.forEach(function(l){
    var m = LINE_RE.exec(l.trim()); if(!m) return;
    var p = m[1].split('/').map(function(x){return parseInt(x,10);});
    if(p[0]>12 && p[1]<=12) br++;
    else if(p[1]>12 && p[0]<=12) us++;
    var y=p[2]<100?p[2]+2000:p[2];
    pares.push([p[0],p[1],y]);
    if(/[APap]\.?\s?[Mm]/.test(m[2])) ampm++;
  });
  if(us>br) return 'us';
  if(br>us) return 'br';
  if(!pares.length) return null;
  if(DICA_MES){
    var dy=+DICA_MES.slice(0,4), dm=+DICA_MES.slice(5,7);
    var hitBR=pares.filter(function(q){return q[2]===dy && q[1]===dm;}).length;
    var hitUS=pares.filter(function(q){return q[2]===dy && q[0]===dm;}).length;
    if(hitUS>hitBR) return 'us';
    if(hitBR>hitUS) return 'br';
  }
  function span(fmt){ var ts=pares.map(function(q){ return fmt==='us'?new Date(q[2],q[0]-1,q[1]).getTime():new Date(q[2],q[1]-1,q[0]).getTime(); }); return Math.max.apply(null,ts)-Math.min.apply(null,ts); }
  var sBR=span('br'), sUS=span('us');
  if(sUS<sBR) return 'us';
  if(sBR<sUS) return 'br';
  return ampm>pares.length/2 ? 'us' : null;
}
function parseData(dstr, tstr){
  var parts = dstr.split('/').map(function(x){return parseInt(x,10);});
  var a=parts[0], b=parts[1], y=parts[2];
  if(y<100) y+=2000;
  var day, month;
  var aValidMonth = a>=1&&a<=12, bValidMonth = b>=1&&b<=12;
  var aValidDay = a>=1&&a<=31, bValidDay = b>=1&&b<=31;
  var optBR = bValidMonth && aValidDay;
  var optUS = aValidMonth && bValidDay;
  if(optBR && optUS){ if(FMT_ATUAL==='us'){ month=a; day=b; } else { day=a; month=b; } }
  else if(optUS){ month=a; day=b; }
  else { day=a; month=b; }
  var ampm = /([APap])\.?\s?[Mm]/.exec(tstr);
  var tparts = tstr.replace(/[APap]\.?\s?[Mm]\.?/,'').trim().split(':').map(function(x){return parseInt(x,10);});
  var h=tparts[0]||0, mi=tparts[1]||0, se=tparts[2]||0;
  if(ampm){
    var pm = /[Pp]/.test(ampm[1]);
    if(pm && h<12) h+=12;
    if(!pm && h===12) h=0;
  }
  return new Date(y, month-1, day, h, mi, se);
}

function parseConversaTxt(texto){
  var lines = (texto||'').split(/\r?\n/);
  FMT_ATUAL = DATEFMT==='auto' ? (detectarFormatoData(lines)||'br') : DATEFMT;
  var msgs = [];
  for(var i=0;i<lines.length;i++){
    var raw = lines[i];
    if(!raw.trim()) continue;
    var m = LINE_RE.exec(raw.trim());
    if(m){
      var dt = parseData(m[1], m[2]);
      var rest = (m[3]||'').replace(/^‎/,'');
      var senderMsg = /^([^:]{1,60}?):\s(.*)$/.exec(rest);
      var sender = senderMsg ? senderMsg[1].trim() : 'Sistema';
      var text = senderMsg ? senderMsg[2] : rest;
      msgs.push({ date:dt, sender:sender, text:text.trim(), sistema:!senderMsg });
    } else if(msgs.length){
      msgs[msgs.length-1].text += '\n'+raw.trim();
    }
  }
  return msgs;
}

/* ---- Parser do formato .md (## D de mês de AAAA + [HH:MM] **Nome:** msg) ---- */
var MESES_PT = {janeiro:1,fevereiro:2,'março':3,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
var MD_DATA_RE = /^##\s+(\d{1,2})\s+de\s+([a-zçã]+)\s+de\s+(\d{4})/im;
var MD_MSG_RE = /^\[(\d{1,2}):(\d{2})\]\s+(.*)$/;
function pareceMd(texto){ return MD_DATA_RE.test(texto) && /^\[\d{1,2}:\d{2}\]/m.test(texto); }
function parseConversaMd(texto){
  var lines=(texto||'').split(/\r?\n/);
  var msgs=[]; var curDate=null; var cur=null; var inQuote=false;
  function fechar(){ if(cur){ cur.text=cur.text.replace(/\n{2,}/g,'\n').trim(); if(cur.text) msgs.push(cur); cur=null; } }
  for(var i=0;i<lines.length;i++){
    var raw=lines[i], t=raw.trim();
    var dm = MD_DATA_RE.exec(t);
    if(dm){ fechar(); inQuote=false; var mes=MESES_PT[dm[2].toLowerCase()]||1; curDate={d:parseInt(dm[1],10),m:mes,y:parseInt(dm[3],10)}; continue; }
    if(t==='---'||t==='') continue;
    var mm = MD_MSG_RE.exec(t);
    if(mm && curDate){
      fechar(); inQuote=false;
      var dt = new Date(curDate.y, curDate.m-1, curDate.d, parseInt(mm[1],10), parseInt(mm[2],10), 0);
      var rest = mm[3];
      var sysM = /^__(.*)__$/.exec(rest);
      var boldM = /^\*\*([^*]+?):\*\*\s*(.*)$/.exec(rest);
      if(sysM){ cur={date:dt, sender:'Sistema', text:sysM[1], sistema:true}; }
      else if(boldM){ cur={date:dt, sender:boldM[1].trim(), text:boldM[2]||'', sistema:false}; }
      else { cur={date:dt, sender:'Sistema', text:rest, sistema:true}; }
      continue;
    }
    if(!cur) continue;
    if(t.indexOf('>')===0){ inQuote = !/_\s*$/.test(t); continue; }
    if(inQuote){ if(/_\s*$/.test(t)) inQuote=false; continue; }
    cur.text += (cur.text?'\n':'')+t;
  }
  fechar();
  return msgs;
}

function parseConversa(texto){
  texto = texto||'';
  if(pareceMd(texto)) return parseConversaMd(texto);
  return parseConversaTxt(texto);
}

/* ============ NOMES E APELIDOS ============ */
// Chave de comparação: ignora acento, maiúscula e variações comuns (Thiago=Tiago, Luiz=Luís, Rhamon=Ramon, Maycon=Maicon)
function chaveNome(n){
  var s=(n||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();
  return s.replace(/th/g,'t').replace(/ph/g,'f').replace(/rh/g,'r').replace(/y/g,'i').replace(/z/g,'s').replace(/(.)\1+/g,'$1');
}
function mapaApelidos(){
  var m={};
  (STORE.apelidos||'').split(/\n/).forEach(function(l){
    var p=l.split('='); if(p.length<2) return;
    var de=p[0].trim(), para=p.slice(1).join('=').trim();
    if(de && para) m[chaveNome(de)]=para;
  });
  return m;
}
var STOP_NOME = /\b(pelo|pela|por|como|sempre|tamb[eé]m|ainda|j[aá]|hoje|agora|ent[aã]o|mas|s[oó]|que|n[aã]o|nao|sim|no|na|ao|em|para|pra|com|sem|muito|mais|menos|tudo|todo|toda|todos|todas|aqui|ali|l[aá]|dia|hor[aá]rio|portao|port[aã]o|entrada|saida|sa[ií]da|equipe|pessoal|galera|senhores|bom|boa|ok|blz|hrs?|horas?)\b/i;
function limparNome(n){
  n = (n||'').replace(/@/g,'').replace(/\s-\s.*$/,''); // "@Felipe Rodrigues - ILED EXTERNO" → "Felipe Rodrigues"
  n = n.replace(/\b\d{1,2}\s*(?::|h)\s*\d{2}\b/gi,'').replace(/\b\d{1,2}\s*h(?:rs?|oras?)?\b/gi,'').replace(/\b(hrs?|horas?|às|as)\b/gi,'');
  n = n.replace(/^[\s\-•*·.:]+|[\s\-•*·.:!?;]+$/g,'').replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu,'').trim();
  return n;
}
function nomeValido(n){
  if(!n) return false;
  if(n.length>40 || n.length<2) return false;
  if(n.trim().split(/\s+/).length>4) return false;
  if(STOP_NOME.test(n)) return false;
  if(/\d/.test(n)) return false;
  if(!/[a-zA-ZÀ-ú]/.test(n)) return false;
  return true;
}
function separarNomes(txt){
  return (txt||'').split(/\n|,|;|\s+e\s+/i).map(limparNome).filter(nomeValido);
}

/* ============ MARCAÇÕES DE ENTRADA / SAÍDA ============ */
var KW_IN  = /^\s*(ENTRADA|CHEGADA|CHEGANDO|CHECK[\s-]?IN)(?![A-Za-zÀ-ú])[:\-]?\s*([\s\S]*)$/i;
var KW_OUT = /^\s*(SA[IÍ]DA|SAINDO|CHECK[\s-]?OUT)(?![A-Za-zÀ-ú])[:\-]?\s*([\s\S]*)$/i;
var HORA_TXT = /\b(\d{1,2})\s*(?::|h)\s*(\d{2})\b|\b(\d{1,2})\s*h(?:rs?|oras?)?\b/i;

// Hora escrita na mensagem ("Saída 14:15") → data/hora completa, usando o dia da mensagem
function horaDigitada(dataEnvio, txtPrimeiraLinha){
  var m = HORA_TXT.exec(txtPrimeiraLinha||''); if(!m) return null;
  var h = parseInt(m[1]!=null?m[1]:m[3],10), mi = m[2]!=null?parseInt(m[2],10):0;
  if(h>23 || mi>59) return null;
  var d = new Date(dataEnvio); d.setHours(h,mi,0,0);
  var diff = d - dataEnvio;
  if(diff > 6*3600000) d.setDate(d.getDate()-1);        // ex: "Saída 23:50" mandada 00:10 do dia seguinte
  else if(diff < -18*3600000) d.setDate(d.getDate()+1);
  return d;
}

function extrairMarcas(msgs, eventoId){
  var out=[];
  var pend=null; // {tipo, dig} — cabeçalho "Entrada" sem nomes: os nomes vêm na próxima mensagem
  function add(nome, tipo, m, dig){
    var env=new Date(m.date); env.setSeconds(0,0); // a conta usa só hora:minuto, como aparece na tela
    out.push({ id:uid(), eventoId:eventoId, nome:nome, tipo:tipo,
      tsEnvio:env.toISOString(), tsDigitada:dig?dig.toISOString():null, remetente:m.sender, txt:(m.text||'').slice(0,300) });
  }
  for(var i=0;i<msgs.length;i++){
    var m = msgs[i];
    if(m.sistema){ continue; }
    var hi = KW_IN.exec(m.text), ho = hi?null:KW_OUT.exec(m.text);
    var h = hi||ho;
    if(h){
      var tipo = hi?'in':'out';
      var resto = h[2]||'';
      var primeira = resto.split('\n')[0];
      var dig = horaDigitada(m.date, primeira);
      var nomes = separarNomes(resto);
      if(nomes.length){ nomes.forEach(function(n){ add(n,tipo,m,dig); }); pend=null; }
      else pend={tipo:tipo, dig:dig};
      continue;
    }
    if(pend && m.text.length<=200 && !/[?]/.test(m.text)){
      var ns = separarNomes(m.text);
      if(ns.length){ ns.forEach(function(n){ add(n,pend.tipo,m,pend.dig); }); }
    }
    pend=null;
  }
  return out;
}

// Hora escrita DEPOIS da hora de envio não é possível para quem já saiu (ex: "Saindo 14:40" mandado 13:44).
// Tolerância: saída até 15 min, entrada até 60 min (aviso antecipado de início). Fora disso, vale a hora do envio.
function digitadaValida(mk){
  if(!mk.tsDigitada) return false;
  var adiantado = new Date(mk.tsDigitada) - new Date(mk.tsEnvio);
  return adiantado <= (mk.tipo==='in' ? 60 : 15)*60000;
}
function tsDe(mk){
  if(mk.tsManual) return mk.tsManual;
  if(STORE.horaBase==='digitada' && digitadaValida(mk)) return mk.tsDigitada;
  return mk.tsEnvio;
}

/* ============ CADASTRO DE COLABORADORES ============ */
var EQUIPES=['','Interna (CLT)','Externa (PJ fixo)','Freelancer'];
function primeiroNome(n){ return chaveNome(n).split(' ')[0]||''; }
function indiceCadastro(){
  var porChave={}, porPrimeiro={}, porToken={};
  function push(m,k,c){ if(!k) return; m[k]=m[k]||[]; if(m[k].indexOf(c)<0) m[k].push(c); }
  STORE.colaboradores.forEach(function(c){
    push(porChave, chaveNome(c.nome), c);
    (c.apelidos||[]).forEach(function(a){ push(porChave, chaveNome(a), c); });
    var tk=chaveNome(c.nome).split(' ');
    push(porPrimeiro, tk[0], c);
    tk.slice(1).forEach(function(t){ if(t.length>2 && !/^(de|da|do|dos|das)$/.test(t)) push(porToken, t, c); });
  });
  return {porChave:porChave, porPrimeiro:porPrimeiro, porToken:porToken};
}
// Como o nome do grupo vira um colaborador:
// 1) nome completo ou apelido cadastrado  2) primeiro nome  3) sobrenome (ex: "Mendes" → Rhamon Mendes)
// Quando há mais de um candidato, desempata pela ESCALA da planilha (quem estava escalado nesse evento)
function resolverNome(bruto, idx, ap, esc){
  var k=chaveNome(bruto), k2=ap[k]?chaveNome(ap[k]):k;
  function escolher(lista, como){
    if(!lista || !lista.length) return null;
    if(lista.length===1) return {colab:lista[0], como:como};
    if(esc){
      var f=lista.filter(function(c){ return esc[c.id]; });
      if(f.length===1) return {colab:f[0], como:'escala'};
    }
    return {colab:null, ambiguo:lista};
  }
  var exatos = idx.porChave[k]||idx.porChave[k2]||[];
  // Com a escala do evento: entre TODOS os candidatos (nome, apelido, primeiro nome, sobrenome),
  // se só UM estava escalado, é ele — mesmo que exista outro cadastrado com o nome idêntico.
  if(esc){
    var todos=exatos.slice();
    if(k2 && k2.indexOf(' ')<0){ (idx.porPrimeiro[k2]||[]).concat(idx.porToken[k2]||[]).forEach(function(c){ if(todos.indexOf(c)<0) todos.push(c); }); }
    var noEv=todos.filter(function(c){return esc[c.id];});
    if(noEv.length===1) return {colab:noEv[0], como: exatos.indexOf(noEv[0])>=0 ? 'cadastro' : 'escala'};
  }
  var r = escolher(exatos.length?exatos:null, 'cadastro');
  if(r) return r;
  if(k2 && k2.indexOf(' ')<0){
    r = escolher(idx.porPrimeiro[k2], 'primeiro'); if(r) return r;
    r = escolher(idx.porToken[k2], 'sobrenome'); if(r) return r;
  }
  return {colab:null};
}
// Participantes do grupo (quem mandou mensagem + quem foi adicionado) → sugestões de nome completo
function infoParticipante(bruto){
  var s=(bruto||'').replace(/^~\s*/,'').trim();
  if(!s || /^\+?[\d\s()\-]+$/.test(s) || /^voc[eê]$/i.test(s)) return null;
  var partes=s.split(/\s+-\s+/), nome=partes[0].trim(), suf=partes.slice(1).join(' - ');
  if(!nomeValido(nome) && nome.split(/\s+/).length>4) return null;
  var eq = /extern/i.test(suf)?'Externa (PJ fixo)':(/freela/i.test(suf)?'Freelancer':'');
  return {nome:nome, sufixo:suf, equipe:eq};
}
function extrairParticipantes(msgs){
  var m={};
  function add(b){ var p=infoParticipante(b); if(p && chaveNome(p.nome)) m[chaveNome(p.nome)]=p; }
  msgs.forEach(function(x){
    if(!x.sistema) add(x.sender);
    var ad=/adicionou\s+(.+)$/i.exec(x.text||'');
    if(x.sistema && ad) ad[1].split(/,\s*|\s+e\s+/).forEach(add);
  });
  return Object.keys(m).map(function(k){return m[k];});
}

function equipeDe(c){ if(c.equipe) return c.equipe; var s=(c.secao||''); if(!s) return ''; return tituloNome(s.replace(/EQUPE/i,'EQUIPE').replace(/\s*-\s*BRAS[IÍ]LIA/i,' BSB').replace(/\s*-\s*S[AÃ]O PA\w*/i,' SP')).replace(/\bBsb\b/,'BSB').replace(/\bSp\b/,'SP'); }
function tsDeRow(r){ return tsDe(r.entrada||r.saida); }

// Junta as marcações em jornadas: cada entrada fecha com a próxima saída da mesma pessoa (pode virar o dia)
var JANELA_DUP = 3*3600000;
function montarJornadas(marcas){
  var ap = mapaApelidos(), idx = indiceCadastro();
  var grupos = {}, cacheAg = {};
  function ag(evId){ if(!(evId in cacheAg)){ var ae=agendaDoEvento(evId); cacheAg[evId]={ae:ae, esc:ae?escaladosSet(ae):null}; } return cacheAg[evId]; }
  marcas.forEach(function(mk){
    var res = resolverNome(mk.nome, idx, ap, ag(mk.eventoId).esc);
    var oficial = ap[chaveNome(mk.nome)];
    var k = mk.eventoId+'|'+(res.colab ? 'c:'+res.colab.id : 'n:'+chaveNome(oficial||mk.nome));
    var g = grupos[k] = grupos[k] || {eventoId:mk.eventoId, colab:res.colab, como:res.como, ambiguo:res.ambiguo, oficial:oficial, grafias:{}, ev:[]};
    if(res.como==='cadastro' || !g.como) g.como=res.como;
    var gr = limparNome(mk.nome); g.grafias[gr]=(g.grafias[gr]||0)+1;
    g.ev.push(mk);
  });
  var rows=[];
  Object.keys(grupos).forEach(function(k){
    var g=grupos[k];
    var grafias = Object.keys(g.grafias).sort(function(a,b){return g.grafias[b]-g.grafias[a];});
    var nome = g.colab ? g.colab.nome : (g.oficial || grafias[0]);
    g.ev.sort(function(a,b){ return new Date(tsDe(a))-new Date(tsDe(b)); });
    var aberta=null, ultima=null;
    function novaLinha(e,s){ var r={eventoId:g.eventoId, nome:nome, colab:g.colab, como:g.como, ambiguo:g.ambiguo, equipe:g.colab?equipeDe(g.colab):'', grafias:grafias, entrada:e, saida:s, extras:[]}; rows.push(r); return r; }
    g.ev.forEach(function(mk){
      var t = new Date(tsDe(mk));
      if(mk.tipo==='in'){
        if(aberta){
          if(t - new Date(tsDe(aberta.entrada)) < JANELA_DUP){ aberta.extras.push(mk); return; }
          aberta = null;
        }
        aberta = novaLinha(mk,null);
      } else {
        if(aberta){ aberta.saida = mk; ultima = aberta; aberta=null; }
        else if(ultima && ultima.saida && (t - new Date(tsDe(ultima.saida))) < JANELA_DUP){ ultima.extras.push(mk); }
        else { ultima = novaLinha(null, mk); }
      }
    });
  });
  var freq={}; rows.forEach(function(r){ var k=r.eventoId+'|'+chaveNome(r.nome); freq[k]=(freq[k]||0)+1; });
  rows.forEach(function(r){
    r.durMs = (r.entrada && r.saida) ? (new Date(tsDe(r.saida)) - new Date(tsDe(r.entrada))) : null;
    // Avisos: cada um tem um código; você pode validar ("está certo") e a validação fica salva na marcação
    var obj=[];
    function okEm(cod){ return (r.entrada&&r.entrada.ok&&r.entrada.ok[cod]) || (r.saida&&r.saida.ok&&r.saida.ok[cod]); }
    function av(cod, msg, msgOk, opcoes){ obj.push({cod:cod, msg:msg, msgOk:msgOk, validado:!!(msgOk && okEm(cod)), opcoes:opcoes||null}); }
    if(!r.entrada) av('falta','Falta a entrada — preencha a data e a hora ao lado');
    if(!r.saida) av('falta','Falta a saída — preencha a data e a hora ao lado');
    [r.entrada,r.saida].forEach(function(mk){
      if(!mk) return;
      var rot = mk.tipo==='in'?'Entrada':'Saída';
      if(mk.validadoHora) obj.push({cod:'hora', validado:true, msgOk:rot+' validada por você: '+fmtHora(tsDe(mk)), desfazerHora:mk.id});
      else if(!mk.tsManual && STORE.horaBase==='digitada' && mk.tsDigitada && !digitadaValida(mk))
        obj.push({cod:'hora', validado:false, msg:rot+': escreveram '+fmtHora(mk.tsDigitada)+', mas a mensagem foi enviada às '+fmtHora(mk.tsEnvio)+' (antes). Qual vale?',
          opcoes:[{rot:'Usar '+fmtHora(mk.tsEnvio)+' (envio)', fn:'escolherHora(\''+mk.id+'\',\'envio\')'},{rot:'Usar '+fmtHora(mk.tsDigitada)+' (escrita)', fn:'escolherHora(\''+mk.id+'\',\'escrita\')'}]});
    });
    if(r.durMs!=null && r.durMs<=0) av('neg','Saída antes da entrada — corrija a data ou a hora');
    else if(r.durMs!=null && r.durMs<3600000) av('curta','Jornada menor que 1h','Jornada curta conferida por você');
    else if(r.durMs!=null && r.durMs>24*3600000) av('longa','Jornada maior que 24h — pode ter faltado uma saída no meio','Jornada longa conferida por você');
    var A=ag(r.eventoId).ae; r.agendaEv=A;
    var diaE=isoDia(tsDeRow(r)); r.fase=faseDoDia(A, diaE);
    if(A && r.colab){
      var esc1=function(d){ return (A.escala[d]||[]).indexOf(r.colab.id)>=0; };
      var dPrev=isoDia(new Date(new Date(tsDeRow(r)).getTime()-86400000)), dNext=isoDia(new Date(new Date(tsDeRow(r)).getTime()+86400000));
      if(!esc1(diaE) && !esc1(dNext) && !esc1(dPrev)) av('naoesc', r.nome+' não estava escalado(a) neste evento em '+fmtDia(diaE)+' na planilha', 'Fora da escala, conferido por você');
    }
    if(r.ambiguo) av('ambiguo','Há '+r.ambiguo.length+' colaboradores cadastrados com o primeiro nome "'+r.nome+'" — vincule o certo na aba Colaboradores');
    if(freq[r.eventoId+'|'+chaveNome(r.nome)]===1 && (!r.entrada||!r.saida) && !r.colab) av('unico','Nome aparece uma única vez no evento — pode ser apelido de alguém','Nome conferido por você');
    r.alertasObj=obj; r.rev=revDe(r);
    r.alertas=obj.filter(function(a){return !a.validado;}).map(function(a){return a.msg;});
    r.validados=obj.filter(function(a){return a.validado;}).map(function(a){return a.msgOk;});
    r.ordem = new Date(tsDeRow(r)).getTime();
  });
  rows.sort(function(a,b){ var c=a.nome.localeCompare(b.nome,'pt-BR'); return c!==0?c:(a.ordem-b.ordem); });
  return rows;
}

// Nomes do grupo que ainda não estão ligados a um colaborador cadastrado
var PENDENTES=[];
function nomesSemCadastro(rows){

    r.grafias.forEach(function(g){p.grafias[g]=1;}); p.grafias[r.nome]=1; p.eventos[r.eventoId]=1; p.n++;
  });
  return Object.keys(m).map(function(k){
    var p=m[k]; p.grafias=Object.keys(p.grafias);
    var sug={};

      ((ev&&ev.participantes)||[]).forEach(function(pt){
        var kp=chaveNome(pt.nome);
        if(kp===k || (k.indexOf(' ')<0 && primeiroNome(pt.nome)===k)) sug[kp]=pt;
      });
    });
    p.sugestoes=Object.keys(sug).map(function(x){return sug[x];});
    return p;
  }).sort(function(a,b){return a.nome.localeCompare(b.nome,'pt-BR');});
}

/* ---- Financeiro (por palavra-chave) ---- */
var KW = {
  reembolso: /reembols/i,
  pagamento: /pagamento|adiantamento|\bvale\b|gratifica/i,
  desconto: /desconto|\bfalta\b|atraso|avaria|n[ãa]o devolv/i
};
var MONEY_RE = /r\$\s?[\d.]{1,7},\d{2}|r\$\s?\d+/i;
function extrairFinanceiro(msgs, eventoId){
  var rows=[];
  msgs.forEach(function(m){
    if(m.sistema) return;
    var tipo=null;
    if(KW.reembolso.test(m.text)) tipo='Reembolso';
    else if(KW.pagamento.test(m.text)) tipo='Pagamento';
    else if(KW.desconto.test(m.text)) tipo='Desconto';
    if(!tipo) return;
    var mv = MONEY_RE.exec(m.text);
    var valor = mv ? parseFloat(mv[0].replace(/[^\d,]/g,'').replace(',','.'))||0 : 0;
    rows.push({
      id:uid(), eventoId:eventoId, dataHora:m.date, quemEnviou:m.sender,
      tipo:tipo, valor:valor, trecho:m.text.slice(0,220), status: valor?'Pendente':'Verificar valor'
    });
  });
  return rows;
}

/* ---- Anexos / fotos ---- */
var ATTACH_RE = /<attached:\s*([^>]+)>|([\w\-. ]+\.(?:jpe?g|png|webp|gif))\s*\(arquivo anexado\)/i;
function extrairAnexos(msgs){
  var out=[];
  msgs.forEach(function(m){
    var mm = ATTACH_RE.exec(m.text);
    if(mm){ out.push({ filename:(mm[1]||mm[2]||'').trim(), sender:m.sender, date:m.date }); }
  });
  return out;
}

var pendingFiles=[];
function onFilesPicked(files){
  if(!files || !files.length) return;
  pendingFiles = Array.prototype.slice.call(files);

function processarImportacao(){

  var texto = document.getElementById('impTexto').value||'';
  var refSel = document.getElementById('impAgenda') ? document.getElementById('impAgenda').value : '';
  if(refSel && !nomeEvento){ var ae0=acharAgendaEvento(refSel); if(ae0) nomeEvento=ae0.titulo; }
  if(!nomeEvento){ alert('Escolha o evento da agenda ou dê um nome pro evento antes de processar.'); return; }
  importarConversa(nomeEvento, texto, pendingFiles, refSel||null, null);
}
function importarConversa(nomeEvento, texto, arquivos, agendaRef, eventoId){
  pendingFiles = arquivos||[];
  if(pendingFiles.length){ var mesConv=(agendaRef&&agendaRef.split('|')[0]) || AGENDA_MES || ''; var nConv=0;
    Promise.all(pendingFiles.map(function(fl){ return gravarNaPasta('conversa', nomeEvento+' - '+fl.name, fl, mesConv).then(function(g){ if(g) nConv++; }); }))
      .then(function(){ if(nConv) toast('💬 Conversa guardada em 06_CONVERSAS_WHATSAPP'); }); }
  var evento = eventoId ? STORE.eventos.find(function(e){return e.id===eventoId;}) : null;
  if(!evento && agendaRef) evento = STORE.eventos.find(function(e){return e.agendaRef===agendaRef;});
  if(!evento) evento = STORE.eventos.find(function(e){return e.nome.toLowerCase()===nomeEvento.toLowerCase();});
  if(!evento){ evento={id:uid(),nome:nomeEvento,criadoEm:new Date().toISOString()}; STORE.eventos.push(evento); }
  if(fechamentoDoEvento(evento.id) || (agendaRef && STORE.fechamentos && STORE.fechamentos.some(function(f){return f.evento_ref===agendaRef;}))){ bloqueado(evento.id); if(!fechamentoDoEvento(evento.id)) alert('🔒 Este evento já foi fechado — a conversa não pode ser reimportada.'); return; }
  if(agendaRef) evento.agendaRef=agendaRef;
  DICA_MES = (evento.agendaRef||'').split('|')[0] || null;

  function finalizar(textoFinal, anexosMap){
    var msgs = parseConversa(textoFinal);
    if(!msgs.length){ alert('Não encontrei mensagens no formato esperado. Confira se o arquivo é uma exportação de conversa do WhatsApp (.txt ou .md).'); return; }
    var marcas = extrairMarcas(msgs, evento.id);
    // reimportação: mantém o que você já validou/corrigiu e o que lançou à mão
    var antigas = STORE.marcas.filter(function(m){return m.eventoId===evento.id;});
    var mapa={}; antigas.forEach(function(m){ mapa[m.tipo+'|'+chaveNome(m.nome)+'|'+m.tsEnvio]=m; });
    marcas.forEach(function(m){ var o=mapa[m.tipo+'|'+chaveNome(m.nome)+'|'+m.tsEnvio]; if(o){ if(o.tsManual) m.tsManual=o.tsManual; if(o.validadoHora) m.validadoHora=true; if(o.ok) m.ok=o.ok; if(o.rev) m.rev=o.rev; } });
    marcas = marcas.concat(antigas.filter(function(m){return m.manual;}));
    evento.participantes = extrairParticipantes(msgs);
    var fin = []; // financeiro desativado (não usado)
    STORE.marcas = STORE.marcas.filter(function(r){return r.eventoId!==evento.id;}).concat(marcas);
    STORE.financeiro = STORE.financeiro.filter(function(r){return r.eventoId!==evento.id;}).concat(fin);
    if(anexosMap){
      var anexos = extrairAnexos(msgs);
      STORE.fotos = STORE.fotos.filter(function(f){return f.eventoId!==evento.id;});
      anexos.forEach(function(a){
        var url = anexosMap[a.filename];
        if(url){ STORE.fotos.push({ id:uid(), eventoId:evento.id, filename:a.filename, sender:a.sender, date:a.date, url:url, marcado:false, nota:'' }); }
      });
    }
    salvar();
    FILTRO_EV = evento.id;
    ['impNomeEvento','impTexto'].forEach(function(id){ var el=document.getElementById(id); if(el) el.value=''; });
    pendingFiles=[];
    var zn=document.getElementById('zipNome'); if(zn) zn.textContent='';
    TAB='horarios';
    render();
    var jor = montarJornadas(marcas);
    var aeChk=acharAgendaEvento(evento.agendaRef);
    if(aeChk && marcas.length){
      var ini=new Date(aeChk.inicio+'T00:00:00').getTime()-5*86400000, fim=new Date(aeChk.fim+'T23:59:59').getTime()+5*86400000;
      var fora=marcas.filter(function(m){ var t=new Date(tsDe(m)).getTime(); return t<ini||t>fim; }).length;
      if(fora) alert('⚠ Atenção: '+fora+' registro(s) ficaram com data fora do período do evento na planilha ('+fmtDia(aeChk.inicio)+' a '+fmtDia(aeChk.fim)+'). Confira se a conversa é do grupo certo.');
    }
    var compl = jor.filter(function(r){return r.entrada&&r.saida;}).length;
    alert('Pronto! "'+evento.nome+'": '+compl+' jornada(s) completa(s)'+'.\n'+(function(){var n=jor.filter(function(r){return r.alertas.length;}).length; return n? n+' linha(s) marcada(s) pra conferir — use o filtro "Só o que precisa conferir".' : 'Nenhuma linha precisou de conferência.';})()+'\nData lida como '+(FMT_ATUAL==='us'?'mês/dia (celular em inglês)':'dia/mês')+'.');
  }

  var zipFiles = pendingFiles.filter(function(f){return /\.zip$/i.test(f.name);});
  var textFiles = pendingFiles.filter(function(f){return /\.(txt|md)$/i.test(f.name);});

  function lerTextFiles(cb){
    if(!textFiles.length){ cb(''); return; }
    var lidos=0, partes=new Array(textFiles.length);
    textFiles.forEach(function(f,idx){
      var reader=new FileReader();
      reader.onload=function(){ partes[idx]=reader.result; lidos++; if(lidos===textFiles.length) cb(partes.join('\n')); };
      reader.readAsText(f, 'utf-8');
    });
  }

  lerTextFiles(function(textoDosArquivos){
    var textoBase = [texto, textoDosArquivos].filter(Boolean).join('\n');
    if(zipFiles.length){
      JSZip.loadAsync(zipFiles[0]).then(function(zip){
        var txtEntry=null, imgEntries=[];
        zip.forEach(function(path,entry){
          if(/\.(txt|md)$/i.test(path)) txtEntry=entry;
          else if(/\.(jpe?g|png|webp|gif)$/i.test(path)) imgEntries.push(entry);
        });
        function seguir(zipTexto){
          var full = textoBase ? (textoBase+'\n'+zipTexto) : zipTexto;
          var promises = imgEntries.map(function(entry){
            return entry.async('blob').then(function(blob){
              return { name: entry.name.split('/').pop(), url: URL.createObjectURL(blob) };
            });
          });
          Promise.all(promises).then(function(list){
            var map={};
            list.forEach(function(it){ map[it.name]=it.url; });
            finalizar(full, map);
          });
        }
        if(txtEntry) txtEntry.async('string').then(seguir);
        else seguir('');
      }).catch(function(err){ alert('Não consegui ler o arquivo .zip: '+err.message); });
    } else {
      if(!textoBase.trim()){ alert('Cole o texto exportado, ou escolha o(s) arquivo(s) .txt/.md/.zip.'); return; }
      finalizar(textoBase, null);
    }
  });
}

/* ============ AGENDA DO MÊS (planilha CRONOGRAMA do Drive) ============ */
var MESES_NOME=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function tituloNome(n){
  return (n||'').toLowerCase().replace(/\s+/g,' ').trim().split(' ').map(function(w,i){
    if(i>0 && /^(de|da|do|dos|das|e)$/.test(w)) return w;
    return w.charAt(0).toUpperCase()+w.slice(1);
  }).join(' ');
}
function chaveEvento(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'').replace(/(.)\1+/g,'$1');
}
// "MG  - MART MINAS 393,5m² (MONTAGEM/TESTE)" → {uf:'MG', nome:'MART MINAS 393,5m²', fase:'MONTAGEM/TESTE'}
function parseCelulaEvento(txt){
  var s=String(txt||'').replace(/\s+/g,' ').trim(); if(!s) return null;
  var m=/^([A-Z]{2})\s*-\s*(.+)$/.exec(s); if(!m) return null;
  var resto=m[2], fase='';
  var f=/\(([^)]*)\)?\s*$/.exec(resto);
  if(f){ fase=f[1].trim().toUpperCase().replace(/DESM\.?$/,'DESMONTAGEM'); resto=resto.slice(0,f.index).trim(); }
  resto=resto.replace(/\s*-\s*$/,'').trim();
  return {uf:m[1], nome:resto, fase:fase, key:chaveEvento(m[1]+resto)};
}
function lerPlanilhaMes(files){
  var f=files && files[0]; if(!f) return;
  if(typeof XLSX==='undefined'){ alert('Não consegui carregar o leitor de Excel (precisa de internet na primeira vez que abre o programa).'); return; }
  var rd=new FileReader();
  rd.onload=function(){
    try{ var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'}); processarCronograma(wb, f.name);
      if(AGENDA_MES) gravarNaPasta('planilha', AGENDA_MES+'_'+f.name, f).then(function(g){ if(g) toast('📊 Planilha guardada em 05_PLANILHAS_CRONOGRAMA'); }); }
    catch(e){ console.error(e); alert('Não consegui ler essa planilha: '+e.message); }
  };
  rd.readAsArrayBuffer(f);
}
function processarCronograma(wb, nomeArq){
  var nomeAba = wb.SheetNames.find(function(n){return /cronograma/i.test(n);}) || wb.SheetNames[0];
  var ws = wb.Sheets[nomeAba];
  var ref = XLSX.utils.decode_range(ws['!ref']);
  function raw(r,c){ var cell=ws[XLSX.utils.encode_cell({r:r,c:c})]; return cell?cell:null; }
  var fill={};
  (ws['!merges']||[]).forEach(function(m){
    var cell=raw(m.s.r,m.s.c); if(!cell) return;
    for(var r=m.s.r;r<=m.e.r;r++) for(var c=m.s.c;c<=m.e.c;c++) if(r!==m.s.r||c!==m.s.c) fill[r+','+c]=cell.v;
  });
  function get(r,c){ var cell=raw(r,c); if(cell && cell.v!=null && String(cell.v).trim()!=='') return cell.v; var v=fill[r+','+c]; return v==null?'':v; }
  function txt(r,c){ return String(get(r,c)||'').replace(/\s+/g,' ').trim(); }

  // 1ª linha: datas → só o mês predominante
  var cols=[], contaMes={};
  for(var c=1;c<=ref.e.c;c++){
    var cell=raw(0,c); if(!cell) continue;
    var y,mo,d;
    if(cell.t==='n' && cell.v>30000 && cell.v<80000){ var p=XLSX.SSF.parse_date_code(cell.v); y=p.y; mo=p.m; d=p.d; }
    else if(cell.v instanceof Date){ var dt=new Date(cell.v.getTime()+12*3600000); y=dt.getFullYear(); mo=dt.getMonth()+1; d=dt.getDate(); }
    else continue;
    var mes=y+'-'+pad2(mo); contaMes[mes]=(contaMes[mes]||0)+1;
    cols.push({c:c, mes:mes, dia:mes+'-'+pad2(d)});
  }
  var mesRef=Object.keys(contaMes).sort(function(a,b){return contaMes[b]-contaMes[a];})[0];
  if(!mesRef){ alert('Não encontrei as datas na primeira linha da planilha.'); return; }
  cols=cols.filter(function(x){return x.mes===mesRef;});

  var eventos={};
  function evento(pe){
    var e=eventos[pe.key] = eventos[pe.key] || {key:pe.key, uf:pe.uf, nome:pe.nome, dias:{}, escala:{}};
    return e;
  }
  function addDia(e, dia, fase){ var cur=e.dias[dia]; if(!cur || cur==='—'){ e.dias[dia]=fase||'—'; return; } if(fase && cur.split(' / ').indexOf(fase)<0) e.dias[dia]=cur+' / '+fase; }

  var modo='eventos', secao='', pessoas=[];
  var HEAD=/EQUIPE|EQUPE|FREE\s*-?\s*LANCE/i;
  for(var r=1;r<=ref.e.r;r++){
    var aRaw = raw(r,0) ? String(raw(r,0).v||'').replace(/\s+/g,' ').trim() : '';
    if(/^FROTA/i.test(aRaw)){ modo='frota'; continue; }
    if(aRaw && HEAD.test(aRaw) && !/CARREGADOR/i.test(aRaw)){ modo='equipe'; secao=aRaw; continue; }
    if(modo==='eventos'){
      cols.forEach(function(x){ var pe=parseCelulaEvento(txt(r,x.c)); if(pe) addDia(evento(pe), x.dia, pe.fase); });
    } else if(modo==='equipe' && aRaw && /[A-Za-zÀ-ú]/.test(aRaw)){
      pessoas.push({linha:r, bruto:aRaw, secao:secao});
    }
  }
  // escala de cada pessoa: todas as linhas do bloco dela (até o próximo nome)
  pessoas.forEach(function(p,i){
    var fim = (i+1<pessoas.length ? pessoas[i+1].linha : ref.e.r+1);
    p.dias={};
    for(var r=p.linha;r<fim;r++){
      var aqui = raw(r,0) ? String(raw(r,0).v||'').trim() : '';
      if(r>p.linha && aqui && HEAD.test(aqui)) break;
      cols.forEach(function(x){ var t=txt(r,x.c); if(t && !p.dias[x.dia]) p.dias[x.dia]=t; });
    }
  });

  // cadastro: cria/atualiza colaboradores a partir da planilha
  var novos=0, atualizados=0;
  var base = function(sec){ return /PAUL|SP\b/i.test(sec)?'São Paulo':(/BRAS|BSB/i.test(sec)?'Brasília':''); };
  pessoas.forEach(function(p){
    var partes=p.bruto.split(/\s+-\s+|\s-|-\s/);
    var nome=tituloNome(partes[0].replace(/[^A-Za-zÀ-ú.' ]/g,' '));
    var cidade=(partes[1]||'').trim().toUpperCase();
    if(!nome || nome.length<2) return;
    var freela=/FREE/i.test(p.secao);
    var k=chaveNome(nome);
    var c=STORE.colaboradores.find(function(x){ return x.origem==='planilha' && chaveNome(x.nome)===k && (x.cidade||'')===cidade && (x.secao||'')===p.secao; });
    if(!c){
      c={id:uid(), nome:nome, apelidos:[], equipe:freela?'Freelancer':'', funcao:'', cidade:cidade, secao:p.secao, base:base(p.secao), origem:'planilha'};
      STORE.colaboradores.push(c); novos++;
    } else { if(freela && !c.equipe) c.equipe='Freelancer'; atualizados++; }
    p.colab=c;
  });
  // junta cadastros feitos pelo grupo (sugestões) com o nome oficial da planilha, quando não há dúvida
  var daPlanilha=STORE.colaboradores.filter(function(x){return x.origem==='planilha';});
  STORE.colaboradores.filter(function(x){return x.origem!=='planilha';}).forEach(function(x){
    var kx=chaveNome(x.nome), px=primeiroNome(x.nome);
    var alvo=daPlanilha.filter(function(p){return chaveNome(p.nome)===kx;});
    if(alvo.length!==1) alvo=daPlanilha.filter(function(p){return primeiroNome(p.nome)===px;});
    if(alvo.length!==1) return;
    var p=alvo[0];
    [x.nome].concat(x.apelidos||[]).forEach(function(a){ if(chaveNome(a)!==chaveNome(p.nome) && !p.apelidos.some(function(z){return chaveNome(z)===chaveNome(a);})) p.apelidos.push(a); });
    if(!p.equipe && x.equipe) p.equipe=x.equipe;
    if(!p.funcao && x.funcao) p.funcao=x.funcao;
    STORE.colaboradores=STORE.colaboradores.filter(function(z){return z.id!==x.id;});
  });

  // escala: liga cada pessoa aos eventos dos dias dela (cria evento se ele só aparece na escala)
  var outras={}; // atividades que não são evento (GALPÃO etc.)
  pessoas.forEach(function(p){
    if(!p.colab) return;
    Object.keys(p.dias).forEach(function(dia){
      var pe=parseCelulaEvento(p.dias[dia]);
      if(!pe){ (outras[dia]=outras[dia]||[]).push({colab:p.colab.id, texto:p.dias[dia]}); return; }
      var e=eventos[pe.key];
      if(!e){ // tenta achar ignorando a metragem
        var semM=chaveEvento(pe.uf+pe.nome.replace(/\d[\d.,]*\s*m(²|2)?.*$/i,''));
        e=Object.keys(eventos).map(function(k){return eventos[k];}).find(function(ev){ return chaveEvento(ev.uf+ev.nome.replace(/\d[\d.,]*\s*m(²|2)?.*$/i,''))===semM; });
      }
      if(!e) e=evento(pe);
      if(!e.dias[dia]) addDia(e, dia, pe.fase);
      e.escala[dia]=e.escala[dia]||[];
      if(e.escala[dia].indexOf(p.colab.id)<0) e.escala[dia].push(p.colab.id);
    });
  });

  var lista=Object.keys(eventos).map(function(k){return eventos[k];});
  lista.forEach(function(e){ e.titulo=e.uf+' - '+e.nome; e.inicio=Object.keys(e.dias).sort()[0]; e.fim=Object.keys(e.dias).sort().slice(-1)[0];
    var ps={}; Object.keys(e.escala).forEach(function(d){ e.escala[d].forEach(function(id){ps[id]=1;}); }); e.nPessoas=Object.keys(ps).length; });
  lista.sort(function(a,b){ return a.inicio<b.inicio?-1:(a.inicio>b.inicio?1:a.titulo.localeCompare(b.titulo)); });

  STORE.agendas = STORE.agendas||{};
  STORE.agendas[mesRef] = {mes:mesRef, arquivo:nomeArq, importadoEm:new Date().toISOString(), eventos:lista, outras:outras};
  AGENDA_MES = mesRef;
  var lig = autoVincular();
  salvar(); TAB='agenda'; render();
  var mm=mesRef.split('-');
  alert('Planilha de '+MESES_NOME[+mm[1]-1]+'/'+mm[0]+' lida!\n\n• '+lista.length+' eventos ('+lista.filter(function(e){return e.nPessoas;}).length+' com equipe escalada)\n• '+pessoas.length+' pessoas na escala ('+novos+' novas no cadastro)'+(lig?'\n• '+lig+' conversa(s) já importada(s) ligada(s) ao evento certo':''));
}
function agendaAtual(){ var a=STORE.agendas||{}; if(AGENDA_MES && a[AGENDA_MES]) return a[AGENDA_MES]; var k=Object.keys(a).sort().slice(-1)[0]; AGENDA_MES=k||null; return k?a[k]:null; }
function acharAgendaEvento(ref){
  if(!ref) return null; var p=ref.split('|'); var ag=(STORE.agendas||{})[p[0]]; if(!ag) return null;

      if(r && r.error) throw r.error;

      return Promise.all([cl.from('wa_fechamentos').select('*').order('fechado_em'), cl.from('wa_fechamento_adendos').select('*').order('criado_em')]);
    }).then(function(rs){
      if(rs[0].error) throw rs[0].error; if(rs[1].error) throw rs[1].error;
      var novos=0;
      rs[0].data.forEach(function(row){
        if(fs.some(function(f){return f.id===row.id;})) return;
        var f=row.dados; f.id=row.id; f.hash=row.hash; f.adendos=[]; f.sync='ok'; fs.push(f); novos++;
      });
      rs[1].data.forEach(function(a){
        var f=fs.find(function(x){return x.id===a.fechamento_id;}); if(!f) return;
        if((f.adendos||[]).some(function(x){return x.id===a.id;})) return;
        f.adendos.push({id:a.id, fechamento_id:a.fechamento_id, criado_em:a.criado_em, criado_por:a.criado_por, tipo:a.tipo, texto:a.texto, dados:a.dados, sync:'ok'});
      });
      STORE.fechamentos=fs;
      STORE.marcas=STORE.marcas.filter(function(m){ var f=fechamentoDoEvento(m.eventoId); return !(f && f.sync==='ok'); });
      SB_STATUS='ok'; STORE.ultimaSync=new Date().toISOString(); salvar(); render();
      if(!silencioso) toast('☁ Banco sincronizado'+(novos?' — '+novos+' fechamento(s) trazido(s) do banco':''));
      return true;
    });
  }).catch(function(e){
    console.error(e); SB_STATUS='erro: '+(e.message||e);
    if(!silencioso) alert('Erro ao falar com o banco: '+(e.message||e)+'\n\nSe for a primeira vez, rode o SQL "wa_fechamentos.sql" no Supabase.');
    render(); return false;
  });
}

/* ============ TUDO NA NUVEM: abrir de qualquer conta / computador / celular ============ */
// O "estado de trabalho" (agenda, cadastro, conversas, validações) fica na tabela wa_estado do Supabase.
// Cada aparelho guarda uma cópia; ao abrir, puxa a versão mais nova; ao salvar, envia em ~1,5s.
var ESTADO_ID='principal', ESTADO_PUSH_T=null, ESTADO_STATUS='', APLICANDO_REMOTO=false, NUVEM_ON=false;
function metaEstado(){ try{ return JSON.parse(localStorage.getItem('wa_estado_meta')||'{}'); }catch(e){ return {}; } }
function setMetaEstado(m){ try{ localStorage.setItem('wa_estado_meta', JSON.stringify(m)); }catch(e){} }
function estadoParaBanco(){
  return { eventos:STORE.eventos, marcas:STORE.marcas, financeiro:STORE.financeiro, colaboradores:STORE.colaboradores,
    agendas:STORE.agendas, apelidos:STORE.apelidos, horaBase:STORE.horaBase, visao:STORE.visao };
}
function aplicarEstado(d){
  APLICANDO_REMOTO=true;
  STORE.eventos=d.eventos||[]; STORE.marcas=d.marcas||[]; STORE.financeiro=[]; STORE.colaboradores=d.colaboradores||[];
  STORE.agendas=d.agendas||{}; if(typeof d.apelidos==='string') STORE.apelidos=d.apelidos; if(d.horaBase) STORE.horaBase=d.horaBase; if(d.visao) STORE.visao=d.visao;
  salvar(); APLICANDO_REMOTO=false;
}
// junta duas versões (quando os dois lados mudaram): mantém tudo dos dois; no mesmo item, vale o lado "preferido"
function mesclarEstado(pref, outro){
  function arr(a,b){ var m={}, out=[]; (a||[]).forEach(function(x){ m[x.id]=1; out.push(x); }); (b||[]).forEach(function(x){ if(!m[x.id]) out.push(x); }); return out; }
  var ag={}; Object.keys(outro.agendas||{}).forEach(function(k){ ag[k]=outro.agendas[k]; }); Object.keys(pref.agendas||{}).forEach(function(k){ ag[k]=pref.agendas[k]; });
  return { eventos:arr(pref.eventos,outro.eventos), marcas:arr(pref.marcas,outro.marcas), financeiro:arr(pref.financeiro,outro.financeiro),
    colaboradores:arr(pref.colaboradores,outro.colaboradores), agendas:ag, apelidos:juntarLinhas(pref.apelidos,outro.apelidos), horaBase:pref.horaBase||outro.horaBase, visao:pref.visao||outro.visao };
}
function juntarLinhas(a,b){ var out=[], vist={}; (String(a||'')+'\n'+String(b||'')).split('\n').forEach(function(l){ var k=l.trim().toLowerCase(); if(k && !vist[k]){ vist[k]=1; out.push(l.trim()); } }); return out.join('\n'); }
function estadoVazio(d){ return !d || (!(d.eventos||[]).length && !(d.colaboradores||[]).length && !Object.keys(d.agendas||{}).length); }

function puxarEstado(){
  var cl=sbCliente(); if(!cl || !SB_USER) return Promise.resolve(false);
  return cl.from('wa_estado').select('versao,dados,atualizado_em,atualizado_por').eq('id',ESTADO_ID).maybeSingle().then(function(r){
    if(r.error) throw r.error;
    var meta=metaEstado(), row=r.data;
    if(!row){ // banco ainda vazio: sobe o que este aparelho tem
      if(!estadoVazio(estadoParaBanco())) return enviarEstado(true);
      return true;
    }
    if(row.versao===meta.versao && !meta.sujo) return true;           // já está igual
    if(row.versao!==meta.versao){
      if(meta.sujo && !estadoVazio(estadoParaBanco())){ aplicarEstado(mesclarEstado(estadoParaBanco(), row.dados)); setMetaEstado({versao:row.versao, sujo:true}); return enviarEstado(true); }
      aplicarEstado(row.dados); setMetaEstado({versao:row.versao, sujo:false});
      ESTADO_STATUS='ok'; atualizarSelo(); render();
      return true;
    }
    return enviarEstado(true);                                          // mesma versão, mas tenho mudanças locais
  }).catch(function(e){ console.error(e); ESTADO_STATUS='erro'; atualizarSelo(); return false; });
}
function agendarEnvioEstado(){
  if(APLICANDO_REMOTO) return;
  var m=metaEstado(); if(!m.sujo){ m.sujo=true; setMetaEstado(m); }
  if(!SB_USER) { atualizarSelo(); return; }
  ESTADO_STATUS='salvando'; atualizarSelo();
  clearTimeout(ESTADO_PUSH_T); ESTADO_PUSH_T=setTimeout(function(){ enviarEstado(false); }, 1500);
}
function enviarEstado(jaMesclou){
  var cl=sbCliente(); if(!cl || !SB_USER) return Promise.resolve(false);
  var meta=metaEstado(), dados=estadoParaBanco(), email=SB_USER.email||'';
  var p;
  try{
  if(!meta.versao){
    p=cl.from('wa_estado').insert({id:ESTADO_ID, dados:dados, versao:1, atualizado_por:email}).select('versao');
  } else {
    p=cl.from('wa_estado').update({dados:dados, versao:meta.versao+1, atualizado_por:email}).eq('id',ESTADO_ID).eq('versao',meta.versao).select('versao');
  }
  }catch(e){ console.error(e); ESTADO_STATUS='erro'; atualizarSelo(); return Promise.resolve(false); }
  return p.then(function(r){
    if(r.error && r.error.code==='23505'){ setMetaEstado({versao:0, sujo:true}); return puxarEstado(); } // já existia no banco
    if(r.error) throw r.error;
    if(!r.data || !r.data.length){ // outro aparelho salvou antes: junta e tenta de novo
      if(jaMesclou===2) throw new Error('conflito de versões');
      return cl.from('wa_estado').select('versao,dados').eq('id',ESTADO_ID).single().then(function(x){
        if(x.error) throw x.error;
        aplicarEstado(mesclarEstado(estadoParaBanco(), x.data.dados)); setMetaEstado({versao:x.data.versao, sujo:true});
        return enviarEstado(2);
      });
    }
    setMetaEstado({versao:r.data[0].versao, sujo:false}); ESTADO_STATUS='ok'; STORE.ultimaSync=new Date().toISOString();
    atualizarSelo(); return true;
  }).catch(function(e){ console.error(e); ESTADO_STATUS='erro'; atualizarSelo(); return false; });
}
function atualizarSelo(){
  var el=document.getElementById('nuvem'); if(!el) return;
  var m=metaEstado(), t, cor;
  if(!SB_USER){ t='☁ entrar para salvar na nuvem'; cor='var(--amber)'; el.onclick=function(){ mostrarLogin(); }; }
  else if(ESTADO_STATUS==='erro'){ t='⚠ sem conexão — salvo só neste aparelho'; cor='var(--amber)'; el.onclick=function(){ puxarEstado(); }; }
  else if(ESTADO_STATUS==='salvando' || m.sujo){ t='☁ salvando…'; cor='var(--mut)'; el.onclick=null; }
  else { t='☁ salvo na nuvem · '+(SB_USER.email||''); cor='var(--grn)'; el.onclick=function(){ goTab('banco'); }; }
  el.textContent=t; el.style.color=cor; el.style.borderColor=cor;
}
function pingBanco(){ try{ var cl=sbCliente(); if(cl && cl.rpc) cl.rpc('wa_ping',{origem:'programa'}).then(function(){},function(){}); }catch(e){} }
function iniciarNuvem(){
  if(NUVEM_ON) return; NUVEM_ON=true;
  fecharLogin(); atualizarSelo(); pingBanco();
  puxarEstado().then(function(){ return sincronizarBanco(true); }).then(function(){ render(); atualizarSelo(); }).then(function(){ return iniciarPasta(); });
  // a cada 1 minuto confere se outro aparelho mudou algo (só quando não há nada pendente aqui)
  setInterval(function(){ if(SB_USER && !metaEstado().sujo && !document.hidden) puxarEstado(); }, 60000);
  window.addEventListener('beforeunload', function(e){ if(metaEstado().sujo && SB_USER){ enviarEstado(false); } });
}

function mesAnterior(m){ var y=+m.slice(0,4), mo=+m.slice(5,7)-1; if(mo<1){mo=12;y--;} return y+'-'+pad2(mo); }
function dadosMes(mes){
  var fs=(STORE.fechamentos||[]).filter(function(f){return f.mes===mes;});
  var pes={}, horas={}, min=0, exc=0, acima=0, jorn=0, incompl=0, ress=0, adend=0, semConv=0;
  function soma(nome, m){ var k=chaveNome(nome); pes[k]=nome; horas[k]=(horas[k]||{nome:nome,min:0,dias:0}); horas[k].min+=m||0; horas[k].dias++; }
  fs.forEach(function(f){
    var t=totaisFech(f); min+=t.minutos; exc+=t.acima; jorn+=t.jornadas; incompl+=(f.totais.incompletas||0); ress+=(f.ressalvas||0); adend+=(f.adendos||[]).length;
    if(f.tipo==='sem_conversa') semConv++;
    f.jornadas.forEach(function(j){ soma(j.nome, j.duracao_min); if(j.acima_12h_min>0) acima++; });
    (f.adendos||[]).forEach(function(a){ if(a.tipo==='jornada'&&a.dados){ soma(a.dados.nome, a.dados.duracao_min); if(a.dados.acima_12h_min>0) acima++; } });
    (f.escala||[]).forEach(function(x){ x.nomes.forEach(function(n){ pes[chaveNome(n)]=n; }); });
  });
  var ag=(STORE.agendas||{})[mes], comEquipe=ag?ag.eventos.filter(function(e){return e.nPessoas;}):[];
  var abertos=comEquipe.filter(function(e){ return !fechamentoDaAgenda(mes,e.key) && !fs.some(function(f){return f.evento_ref===mes+'|'+e.key;}); });
  return {fs:fs, pessoas:Object.keys(pes).length, min:min, exc:exc, acima:acima, jorn:jorn, incompl:incompl, ress:ress, adend:adend, semConv:semConv,
    totalEventos: ag?comEquipe.length:fs.length, abertos:abertos,
    top:Object.keys(horas).map(function(k){return horas[k];}).sort(function(a,b){return b.min-a.min;}).slice(0,5)};
}
function baixarRelatorioDiretoria(mes){
  mes = mes || BANCO_MES || AGENDA_MES;
  if(!mes){ alert('Ainda não há mês com dados.'); return; }
  if(!window.jspdf || !window.jspdf.jsPDF || !window.jspdf.jsPDF.API.autoTable){ alert('Não consegui carregar o gerador de PDF (sem internet?).'); return; }
  var D=dadosMes(mes), A=dadosMes(mesAnterior(mes));
  if(!D.fs.length && !D.totalEventos){ alert('Nenhum evento nesse mês.'); return; }
  var doc=novoPDF(), C=PDF_COR, W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight();
  var ult=new Date(+mes.slice(0,4), +mes.slice(5,7), 0).getDate();
  pdfCabecalho(doc, 'Relatório Mensal · Eventos e Jornadas', 'Competência: '+fmtMesCurto(mes), 'Emitido em '+fmtDT(new Date()));

function acharMarca(id){ return STORE.marcas.find(function(x){return x.id===id;}); }
function editarMarca(id, parte, val){
  var mk=acharMarca(id); if(!mk || !val) return; if(bloqueado(mk.eventoId)) return;
  var cur=new Date(tsDe(mk));
  if(parte==='date'){ var p=val.split('-'); cur.setFullYear(+p[0], +p[1]-1, +p[2]); }
  else { var t=val.split(':'); cur.setHours(+t[0], +t[1], 0, 0); }
  mk.tsManual=cur.toISOString(); delete mk.validadoHora; salvar(); render();
}
function completarJornada(idx){
  var r=ULTIMAS[idx]; if(!r) return; if(bloqueado(r.eventoId)) return;
  var d=document.getElementById('nd_'+idx).value, t=document.getElementById('nt_'+idx).value;
  if(!d || !t) return;
  var p=d.split('-'), h=t.split(':');

function delJornada(idx){

  var ids={}; [r.entrada,r.saida].concat(r.extras).forEach(function(m){ if(m) ids[m.id]=true; });

/* ============ AÇÕES — CADASTRO ============ */
function cadastrar(nome, apelidos, equipe){
  nome=(nome||'').replace(/\s+/g,' ').trim(); if(!nome) return null;
  var k=chaveNome(nome);
  var c=STORE.colaboradores.find(function(x){return chaveNome(x.nome)===k;});
  if(!c){ c={id:uid(), nome:nome, apelidos:[], equipe:equipe||'', funcao:''}; STORE.colaboradores.push(c); }
  else if(equipe && !c.equipe) c.equipe=equipe;
  (apelidos||[]).forEach(function(a){
    a=limparNome(a); var ka=chaveNome(a);
    if(a && ka!==chaveNome(c.nome) && !c.apelidos.some(function(x){return chaveNome(x)===ka;})) c.apelidos.push(a);
  });
  return c;
}
function resolverPendente(i){
  var p=PENDENTES[i]; if(!p) return;
  var vinc=document.getElementById('pv_'+i).value;
  if(vinc){
    var c=STORE.colaboradores.find(function(x){return x.id===vinc;});
    if(c) cadastrar(c.nome, p.grafias, '');
  } else {
    var nome=document.getElementById('pn_'+i).value;
    if(!nome.trim() || nome.trim().split(/\s+/).length<2){ alert('Escreva o nome completo (nome e sobrenome).'); return; }
    cadastrar(nome, p.grafias, document.getElementById('pe_'+i).value);
  }
  salvar(); render();
}
function usarTodasSugestoes(){
  var n=0;
  PENDENTES.forEach(function(p){ if(p.sugestoes.length===1){ cadastrar(p.sugestoes[0].nome, p.grafias, p.sugestoes[0].equipe); n++; } });
  salvar(); render();
  alert(n+' nome(s) vinculado(s) ao nome completo que aparece no grupo. Confira a aba Colaboradores.');
}
function editColab(id, campo, val){
  var c=STORE.colaboradores.find(function(x){return x.id===id;}); if(!c) return;
  if(campo==='apelidos') c.apelidos=val.split(/[,;\n]/).map(function(s){return s.trim();}).filter(Boolean);
  else c[campo]=val;
  salvar(); render();
}
function delColab(id){
  var c=STORE.colaboradores.find(function(x){return x.id===id;});
  if(!c || !confirm('Excluir '+c.nome+' do cadastro? As jornadas continuam, só voltam a aparecer com o nome do grupo.')) return;
  STORE.colaboradores=STORE.colaboradores.filter(function(x){return x.id!==id;}); salvar(); render();
}
function addColabManual(){
  var nome=document.getElementById('cNome').value, ap=document.getElementById('cApel').value, eq=document.getElementById('cEq').value;
  if(!nome.trim()){ alert('Escreva o nome completo.'); return; }
  cadastrar(nome, ap.split(','), eq); salvar(); render();
}
function importarListaColab(){
  var txt=document.getElementById('cLista').value||''; var n=0;
  txt.split(/\r?\n/).forEach(function(l){
    if(!l.trim()) return;
    var p=l.split(/\t|;/);
    var eq=(p[2]||'').trim(), eqN='';
    if(/clt|intern/i.test(eq)) eqN='Interna (CLT)'; else if(/pj|extern/i.test(eq)) eqN='Externa (PJ fixo)'; else if(/free/i.test(eq)) eqN='Freelancer';
    if(cadastrar(p[0], (p[1]||'').split(','), eqN)) n++;
  });
  salvar(); render(); alert(n+' colaborador(es) adicionados/atualizados.');
}

/* ============ VALIDAÇÃO ============ */
// Marcações da mesma mensagem (ex: "Saindo 14:40, Matheus, Rupert, Leonardo, Luiz") são validadas juntas
function irmaosDe(mk){
  return STORE.marcas.filter(function(x){ return x.eventoId===mk.eventoId && x.tipo===mk.tipo && x.tsEnvio===mk.tsEnvio && x.tsDigitada===mk.tsDigitada && x.remetente===mk.remetente; });
}
function escolherHora(id, qual){
  var mk=acharMarca(id); if(!mk) return; if(bloqueado(mk.eventoId)) return;
  var ir=irmaosDe(mk);
  ir.forEach(function(x){ x.tsManual = (qual==='envio'?x.tsEnvio:x.tsDigitada); x.validadoHora=true; });
  salvar(); render();
  toast('✓ '+(mk.tipo==='in'?'Entrada':'Saída')+' '+fmtHora(mk.tsManual)+' validada'+(ir.length>1?' para as '+ir.length+' pessoas da mesma mensagem':''));
}
function desfazerHora(id){
  var mk=acharMarca(id); if(!mk) return; if(bloqueado(mk.eventoId)) return;
  irmaosDe(mk).forEach(function(x){ delete x.tsManual; delete x.validadoHora; });
  salvar(); render();
}
function validarAlerta(idx, cod){
  var r=ULTIMAS[idx]; if(!r) return; if(bloqueado(r.eventoId)) return;
  [r.entrada,r.saida].forEach(function(mk){ if(mk){ mk.ok=mk.ok||{}; mk.ok[cod]=true; } });
  salvar(); render(); toast('✓ Validado');
}
function desfazerValidacao(idx, cod){
  var r=ULTIMAS[idx]; if(!r) return; if(bloqueado(r.eventoId)) return;
  [r.entrada,r.saida].forEach(function(mk){ if(mk && mk.ok) delete mk.ok[cod]; });
  salvar(); render();
}
function toast(msg){
  var t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1b2a1f;border:1px solid rgba(61,220,132,.5);color:#3ddc84;padding:10px 18px;border-radius:12px;font-weight:700;font-size:13px;z-index:400;box-shadow:0 10px 30px rgba(0,0,0,.5)';
  document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2600);
}

function situacao(r){
  if(r.rev && r.rev.st==='pontual') return 'PONTUAL (dúvida com operacional): '+(r.rev.nota||'');
  if(r.alertas.length) return 'CONFERIR: '+r.alertas.join(' | ');
  if(r.rev && r.rev.st==='validado') return 'Validado'+(r.rev.nota?' — '+r.rev.nota+(r.rev.resposta?' → '+r.rev.resposta:''):'');
  if(r.validados.length) return 'Validado: '+r.validados.join(' | ');
  return 'OK';
}
function nomeArquivo(ext){
  var ev = EXP.ev==='todos'?'todos_eventos':nomeEvento(EXP.ev);
  var d = (EXP.dias && EXP.dias.length===1)?'_'+EXP.dias[0].split('-').reverse().join('-'):'';
  return ('jornadas_'+ev+d).replace(/[^\wÀ-ú-]+/g,'_')+'.'+ext;
}
function descricaoFiltro(sel){
  var dias={}; sel.forEach(function(r){ dias[isoDia(tsDeRow(r))]=fmtData(tsDeRow(r)).slice(0,5); });
  var ds=Object.keys(dias).sort().map(function(k){return dias[k];});
  return 'Evento: '+(EXP.ev==='todos'?'Todos':nomeEvento(EXP.ev))+'   |   Dias: '+(ds.join(', ')||'—')+(EXP.fases?'   |   Fase: '+EXP.fases.join(', '):'')+'   |   Equipe: '+(EXP.equipe==='__sem'?'Sem cadastro':(EXP.equipe||'Todas'));
}
function resumoDias(sel){
  var m={};
  sel.forEach(function(r){ var d=isoDia(tsDeRow(r)); var x=m[d]=m[d]||{ts:tsDeRow(r), pes:{}, ms:0, n:0, sem:0}; x.pes[chaveNome(r.nome)]=1; x.n++; x.ms+=(r.durMs||0); if(r.durMs==null) x.sem++; });
  return Object.keys(m).sort().map(function(k){ var x=m[k]; return {dia:diaSemana(x.ts)+', '+fmtData(x.ts), pessoas:Object.keys(x.pes).length, n:x.n, ms:x.ms, sem:x.sem}; });
}
function resumoPessoas(sel){
  var m={};
  sel.forEach(function(r){ if(r.durMs==null) return; var k=chaveNome(r.nome); var x=m[k]=m[k]||{nome:r.nome, equipe:r.equipe, n:0, ms:0, max:0, acima:0};
    x.n++; x.ms+=r.durMs; if(r.durMs>x.max) x.max=r.durMs; if(r.durMs>12*3600000) x.acima++; });
  return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return a.nome.localeCompare(b.nome,'pt-BR');});
}

function faltasExport(sel){
  var evs={}; sel.forEach(function(r){evs[r.eventoId]=1;});
  if(EXP.ev!=='todos') evs[EXP.ev]=1;
  var out=[]; Object.keys(evs).forEach(function(id){
    var rowsEv=montarJornadas(STORE.marcas.filter(function(m){return m.eventoId===id;}));
    faltasEscala(id, rowsEv).forEach(function(x){
      if(EXP.dias && EXP.dias.indexOf(x.dia)<0) return;
      if(EXP.fases && !fasesDe({fase:x.fase}).some(function(f){return EXP.fases.indexOf(f)>=0;})) return;
      x.ev=id; out.push(x); });
  });
  return out.sort(function(a,b){return a.dia<b.dia?-1:1;});
}
function baixarExcel(){
  lerExportForm(); var sel=linhasExport(); if(!sel.length) return;
  if(typeof XLSX==='undefined'){ alert('Não consegui carregar o gerador de Excel (sem internet?). Vou baixar em CSV, que também abre no Excel.'); exportarJornadas(sel); return; }
  var dur=function(ms){ return ms==null?'':{t:'n', v:ms/86400000, z:'[h]:mm'}; };
  var aoa=[['ILED · Relatório de Jornadas'],[descricaoFiltro(sel)],['Gerado em '+fmtDT(new Date())],[],
    ['Dia','Evento','Fase','Nome completo','Nome no grupo','Equipe','Data entrada','Hora entrada','Data saída','Hora saída','Jornada','Acima de 12h','Situação']];
  sel.forEach(function(r){
    var e=r.entrada?tsDe(r.entrada):null, s=r.saida?tsDe(r.saida):null;
    aoa.push([diaSemana(tsDeRow(r)).slice(0,3)+' '+fmtData(tsDeRow(r)), nomeEvento(r.eventoId), r.fase||'', r.colab?r.nome:r.nome+' (sem cadastro)', r.grafias.join(' / '), r.equipe||'',
      e?fmtData(e):'', e?fmtHora(e):'', s?fmtData(s):'', s?fmtHora(s):'', dur(r.durMs), (r.durMs!=null&&r.durMs>12*3600000)?dur(r.durMs-12*3600000):'', situacao(r)]);
  });
  var tot=sel.reduce(function(a,r){return a+(r.durMs||0);},0);
  aoa.push([]); aoa.push(['','','','TOTAL','','','','','','',dur(tot),'','']);
  var wb=XLSX.utils.book_new();
  var ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[14,24,20,28,18,17,12,10,12,10,10,12,60].map(function(w){return {wch:w};});
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:12}},{s:{r:1,c:0},e:{r:1,c:12}},{s:{r:2,c:0},e:{r:2,c:12}}];
  ws['!autofilter']={ref:'A5:M'+(5+sel.length)};
  XLSX.utils.book_append_sheet(wb, ws, 'Jornadas');
  if(EXP.dia){
    var a2=[['Dia','Pessoas','Jornadas','Sem saída','Total de horas']];
    resumoDias(sel).forEach(function(d){ a2.push([d.dia,d.pessoas,d.n,d.sem,dur(d.ms)]); });
    var w2=XLSX.utils.aoa_to_sheet(a2); w2['!cols']=[{wch:28},{wch:10},{wch:10},{wch:10},{wch:14}];
    XLSX.utils.book_append_sheet(wb, w2, 'Resumo por dia');
  }
  if(EXP.pessoa){
    var a3=[['Nome completo','Equipe','Jornadas','Total de horas','Maior jornada','Jornadas acima de 12h']];
    resumoPessoas(sel).forEach(function(p){ a3.push([p.nome,p.equipe||'',p.n,dur(p.ms),dur(p.max),p.acima]); });
    var w3=XLSX.utils.aoa_to_sheet(a3); w3['!cols']=[{wch:28},{wch:17},{wch:10},{wch:14},{wch:14},{wch:20}];
    XLSX.utils.book_append_sheet(wb, w3, 'Total por pessoa');
  }
  var fx=faltasExport(sel);
  if(fx.length){
    var a4=[['Dia','Evento','Fase','Escalado na planilha sem registro no grupo']];
    fx.forEach(function(x){ x.nomes.forEach(function(n){ a4.push([fmtDia(x.dia)+'/'+x.dia.slice(0,4), nomeEvento(x.ev), x.fase, n]); }); });
    var w4=XLSX.utils.aoa_to_sheet(a4); w4['!cols']=[{wch:12},{wch:30},{wch:22},{wch:32}];
    XLSX.utils.book_append_sheet(wb, w4, 'Escalados sem registro');
  }
  salvarXlsx(wb, nomeArquivo('xlsx'));
}

// Cabeçalho preto com logo + título branco + linha vermelha
function pdfCabecalho(doc, titulo, dir1, dir2){
  var W=doc.internal.pageSize.getWidth(), C=PDF_COR;
  doc.setFillColor(C.preto[0],C.preto[1],C.preto[2]); doc.rect(0,0,W,30,'F');
  doc.setFillColor(C.verm[0],C.verm[1],C.verm[2]); doc.rect(0,30,W,1.1,'F');
  try{ doc.addImage(ILED_LOGO,'JPEG',13,6.5,22,17.5); }catch(e){}
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(14.5);
  doc.text(titulo, 41, 14);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(185,187,195);
  doc.text('ILED Produções · Gestão de Pessoas', 41, 20.5);
  doc.setFontSize(9); doc.setTextColor(185,187,195);
  if(dir1) doc.text(dir1, W-13, 14, {align:'right'});
  if(dir2) doc.text(dir2, W-13, 20.5, {align:'right'});
}
// Nome grande + linha cinza de detalhes (como "ADRIANO ALVES / Equipe Técnica · Brasília · ...")
function pdfTitulo(doc, grande, detalhe, y){
  doc.setTextColor(PDF_COR.txt[0],PDF_COR.txt[1],PDF_COR.txt[2]); doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text(grande, 13, y);
  if(detalhe){ doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(PDF_COR.mut[0],PDF_COR.mut[1],PDF_COR.mut[2]); doc.text(detalhe, 13, y+6); }
}
function pdfRodape(doc){
  var n=doc.internal.getNumberOfPages(), W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight();
  for(var i=1;i<=n;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(PDF_COR.mut2[0],PDF_COR.mut2[1],PDF_COR.mut2[2]);
    doc.text('Documento gerado automaticamente pelo Sistema WhatsApp Eventos · ILED Produções', 13, H-8);
    doc.text('Página '+i+' de '+n, W-13, H-8, {align:'right'}); }
}

  var C=PDF_COR;
